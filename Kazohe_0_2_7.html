            const ast = op("+", op("*", val(x), val(a)), val(b));
            return arithmetic(id, ast, grade === 5 ? E : FS, {
              prompt:
                grade === 5
                  ? `□ ＝ ${expression(val(a))} × △ ＋ ${expression(val(b))}、△ ＝ ${expression(val(x))}`
                  : `x × ${expression(val(a))} ＋ ${expression(val(b))}、x ＝ ${expression(val(x))}（答えは整数か分数で）`,
            });
          },
          kind,
        ),
      );
    }
    if (["G5-C06", "G5-C07", "G5-C08"].includes(id)) {
      const signs =
        id === "G5-C08" ? ["+", "-"] : [id === "G5-C06" ? "+" : "-"];
      return signs.map((sign) =>
        domain(
          [
            [2, 12],
            [2, 12],
            [0, 71],
            [0, 71],
          ],
          ([d, e, n, m]) => {
            if (
              d === e ||
              (id !== "G5-C08" && (n > d || m > e)) ||
              (id === "G5-C06" && (!n || !m || n === d || m === e)) ||
              (id === "G5-C08" &&
                (n >= 6 * d || m >= 6 * e || (n <= d && m <= e))) ||
              (sign === "-" && n * e < m * d)
            ) {
              return null;
            }
            const mixed = (num, den) =>
              lit(
                rat(num, den),
                num > den
                  ? `${Math.floor(num / den)}と${num % den}/${den}`
                  : `${num}/${den}`,
              );
            return arithmetic(
              id,
              op(
                sign,
                id === "G5-C08" ? mixed(n, d) : F(n, d),
                id === "G5-C08" ? mixed(m, e) : F(m, e),
              ),
              FS,
            );
          },
          sign,
        ),
      );
    }
    if (id === "G5-C09") return exprDomains("decimal");
    if (id === "G6-N01") {
      return [
        domain(
          [
            [1, 12],
            [1, 12],
          ],
          ([n, d]) =>
            special(id, "reciprocal", [rat(n, d)], FS, {
              labels: [
                n > d ? `${Math.floor(n / d)}と${n % d}/${d}` : `${n}/${d}`,
              ],
            }),
        ),
      ];
    }
    if (/^G6-C0[1-6]$/.test(id)) {
      const k = Number(id.slice(-2));
      return [
        domain(
          k < 3
            ? [
                [2, 20],
                [0, 100],
                [1, 12],
              ]
            : k < 5
              ? [
                  [2, 20],
                  [2, 20],
                  [0, 20],
                  [0, 20],
                ]
              : [
                  [2, 12],
                  [2, 12],
                  [0, 47],
                  [0, 47],
                ],
          (v) => {
            let a;
            let b;
            if (k < 3) {
              const [d, n, m] = v;
              if (n > 5 * d) return null;
              a = F(n, d);
              b = lit(m);
            } else {
              const [d, e, n, m] = v;
              if (k >= 5 && (n >= 4 * d || m >= 4 * e || (n <= d && m <= e))) {
                return null;
              }
              if (k % 2 === 0 && !m) return null;
              const f = (num, den) =>
                k >= 5 && num > den
                  ? lit(rat(num, den), `${Math.floor(num / den)}と${num % den}/${den}`)
                  : F(num, den);
              a = f(n, d);
              b = f(m, e);
            }
            return arithmetic(id, op(k % 2 ? "*" : "/", a, b), FS);
          },
        ),
      ];
    }
    if (id === "G6-C07") return exprDomains("fraction");
    if (id === "G6-C08") {
      const ops = ["+", "-", "*", "/"];
      return ops.map((sign) =>
        domain(
          [
            [0, 10],
            [1, 99],
            [2, 12],
            [1, 11],
          ],
          ([i, decimalN, d, n]) => {
            if (n >= d) return null;
            const ast = op(
              sign,
              op(
                "+",
                lit(i),
                lit(D(decimalN, 2)),
                sign === "*" || sign === "/",
              ),
              F(n, d),
            );
            try {
              return arithmetic(id, ast, FS, {
                instruction: "答えは整数か分数で",
              });
            } catch {
              return null;
            }
          },
          sign,
        ),
      );
    }
    throw Error(`Generator missing: ${id}`);
  }

  function domains(
    id,
    options = {},
  ) {
    const original = baseDomains(id, options);
    if (!KZWritten.ids.includes(id) || options.written === undefined) {
      return original;
    }
    const mode = options.written;
    if (!["none", "some", "mixed"].includes(mode)) {
      throw Error("筆算の条件をたしかめてね。");
    }
    const available = KZWritten.available(id, options.remainder || "mixed");
    if (mode !== "mixed" && !available.includes(mode)) {
      throw Error("この組合せでは問題を作れません。");
    }
    const modes =
      mode === "mixed" ? available : [mode];
    return original.flatMap((d) =>
      modes.flatMap((condition) => {
        if (
          ["carry", "no-carry"].includes(d.bucket) &&
          (d.bucket === "carry") !== (condition === "some")
        ) {
          return [];
        }
        if (d.bucket === "zero" && condition === "some") return [];
        if (
          ["G4-C04", "G4-C06"].includes(id) &&
          d.bucket === "none" &&
          condition === "some"
        ) {
          return [];
        }
        return [
          {
            ...d,
            bucket: `${d.bucket}:written-${condition}`,
            ...(id === "G5-C03"
              ? {
                  sample: r => {
                    const divisor = randInt(r, 1, 9999);
                    const stepVal = divisor / Number(gcd(divisor, 1000));
                    const dividend =
                      stepVal * randInt(r, 1, Math.floor(99999 / stepVal));
                    return BigInt(dividend - 1) + BigInt(divisor - 1) * 99999n;
                  },
                }
              : {}),
            make: values => {
              const q = d.make(values);
              return q && KZWritten.classify(q).has === (condition === "some")
                ? q
                : null;
            },
          },
        ];
      }),
    );
  }

  function decode(d, rank) {
    let cur = rank;
    return d.dims.map(([lo, hi]) => {
      const n = BigInt(hi - lo + 1);
      const v = Number(cur % n) + lo;
      cur /= n;
      return v;
    });
  }

  function atRank(d, rank) {
    try {
      const q = d.make(decode(d, rank));
      return q ? complete(q, d.bucket) : null;
    } catch {
      return null;
    }
  }

  function randomRank(d, r) {
    if (d.sample) return d.sample(r);
    let x = 0n;
    for (const [lo, hi] of d.dims) {
      x = x * BigInt(hi - lo + 1) + BigInt(randInt(r, 0, hi - lo));
    }
    return x % d.size;
  }

  function createGenerator(seed = 1) {
    return { rngState: seed >>> 0 || 1, ids: {} };
  }

  function generate(
    id,
    options = {},
    state = createGenerator(),
  ) {
    if (!BY_ID[id]) throw Error("Unknown challenge");
    const ds = domains(id, options);
    const r = rng(state.rngState);
    const key = JSON.stringify([id, options]);
    const s = (state.ids[key] ||= { round: [], buckets: {}, last: null });
    if (!s.round.length) {
      s.round = shuffle(
        ds.flatMap((d, i) => Array(d.weight || 1).fill(i)),
        r,
      );
    }
    const bi = s.round.shift();
    if (bi === undefined) throw Error("この条件では問題を作れません");
    const d = ds[bi];
    const b = (s.buckets[bi] ||= { used: [], cursor: "0", cycle: 0 });
    const used = new Set(b.used);
    let q = null;
    let rank = null;
    for (let i = 0; i < 128; i++) {
      const x = randomRank(d, r);
      const candidate = atRank(d, x);
      if (
        candidate &&
        candidate.canonicalKey !== undefined &&
        !used.has(candidate.canonicalKey) &&
        candidate.canonicalKey !== s.last
      ) {
        q = candidate;
        rank = x;
        break;
      }
    }
    if (!q) {
      let scanned = 0n;
      let x = BigInt(b.cursor);
      let repeat = null;
      while (scanned < d.size) {
        const candidate = atRank(d, x);
        if (
          candidate &&
          candidate.canonicalKey !== undefined &&
          !used.has(candidate.canonicalKey)
        ) {
          if (candidate.canonicalKey !== s.last) {
            q = candidate;
            rank = x;
            break;
          }
          repeat = { candidate, x };
        }
        x = (x + 1n) % d.size;
        scanned++;
      }
      if (!q && repeat) {
        q = repeat.candidate;
        rank = repeat.x;
      }
      if (!q) {
        // Exhaustion is established by the complete scan above.
        b.used = [];
        b.cycle++;
        used.clear();
        let first = null;
        for (let scanX = 0n; scanX < d.size; scanX++) {
          const candidate = atRank(d, scanX);
          if (candidate) {
            first ||= { candidate, x: scanX };
            if (candidate.canonicalKey !== s.last) {
              q = candidate;
              rank = scanX;
              break;
            }
          }
        }
        if (!q && first) {
          q = first.candidate;
          rank = first.x;
        }
        if (!q || rank === null) throw Error("この条件では問題を作れません");
      }
    }
    if (rank === null) throw Error("この条件では問題を作れません");
    const canonicalKey = q.canonicalKey || "";
    b.used.push(canonicalKey);
    b.cursor = String((rank + 1n) % d.size);
    s.last = canonicalKey;
    state.rngState = r.state;
    q.cycleId = b.cycle;
    return q;
  }
  /* Run state machine, metrics, fallback evaluation, persistence, backup validation, and KZ API. */

  const BACKUP_TOP_KEYS = [
    "format",
    "appVersion",
    "schemaVersion",
    "settings",
    "bestRecords",
    "recommendation",
    "returnStack",
    "practiceCheckpoint",
  ];

  const BACKUP_SETTINGS_KEYS = [
    "name",
    "sound",
    "effects",
    "onboarded",
    "config",
  ];

  const METRICS_COUNTER_KEYS = [
    "displayN",
    "presented",
    "unshown",
    "learningN",
    "unansweredN",
    "correctProblems",
    "helpProblems",
    "mistakeEvents",
    "hintProblems",
    "firstCorrectProblems",
    "finalSelfCorrectProblems",
    "repeatedWrongProblems",
    "unansweredProblems",
    "learningUnansweredCount",
  ];

  const ANSWER_KINDS = [
    "integer",
    "decimal",
    "fraction",
    "quotient",
    "common",
    "blocks",
    "set",
    "compare",
    "parity",
  ];

  const TASK_KINDS = [
    "arithmetic",
    "compare",
    "parity",
    "divisors",
    "gcd",
    "lcm",
    "round",
    "fraction",
    "reciprocal",
    "common",
    "blocks",
  ];

  function isRemainderMode(v) {
    return v === "none" || v === "some" || v === "mixed";
  }

  function isWrittenMode(v) {
    return v === "none" || v === "some" || v === "mixed";
  }

  function isSupportClass(v) {
    return v === "independent" || v === "supported";
  }

  function isEndReason(v) {
    return v === "completed" || v === "manual" || v === "natural-timeout";
  }

  function isAnswerKind(v) {
    return typeof v === "string" && ANSWER_KINDS.includes(v);
  }

  function isTaskKind(v) {
    return typeof v === "string" && TASK_KINDS.includes(v);
  }

  function isChallengeOptions(v) {
    if (!isRecord(v)) return false;
    if (
      v.table !== undefined &&
      v.table !== null &&
      typeof v.table !== "number"
    ) {
      return false;
    }
    if (v.remainder !== undefined && !isRemainderMode(v.remainder)) return false;
    if (v.written !== undefined && !isWrittenMode(v.written)) return false;
    return true;
  }

  function isRunConfigInput(v) {
    if (!isRecord(v)) return false;
    if (v.mode !== "practice" && v.mode !== "time") return false;
    if (
      v.selectedIds !== undefined &&
      (!Array.isArray(v.selectedIds) ||
        v.selectedIds.some((id) => typeof id !== "string"))
    ) {
      return false;
    }
    if (v.quantity !== undefined && v.quantity !== null && typeof v.quantity !== "number") {
      return false;
    }
    if (
      v.timeLimitMs !== undefined &&
      v.timeLimitMs !== null &&
      typeof v.timeLimitMs !== "number"
    ) {
      return false;
    }
    if (v.optionsById !== undefined) {
      if (!isRecord(v.optionsById)) return false;
      for (const val of Object.values(v.optionsById)) {
        if (val !== undefined && !isChallengeOptions(val)) return false;
      }
    }
    return true;
  }

  function isQuestionShape(v) {
    return (
      isRecord(v) &&
      isChallengeId(v.challengeId) &&
      isTaskKind(v.task) &&
      isRecord(v.answerSpec) &&
      isAnswerKind(v.answerSpec.type)
    );
  }

  function isRawAnswerInput(v) {
    return (
      v === null ||
      v === undefined ||
      typeof v === "string" ||
      typeof v === "number" ||
      isRecord(v)
    );
  }

  function isValidatedSaveData(v) {
    return (
      isRecord(v) &&
      v.format === "kazohe-backup" &&
      v.appVersion === VERSION &&
      v.schemaVersion === 1 &&
      isRecord(v.settings) &&
      isRecord(v.bestRecords) &&
      Array.isArray(v.returnStack)
    );
  }

  function normalizeConfig(c) {
    const rawIds = [...new Set(c.selectedIds || [])].sort();
    if (!rawIds.length) throw Error("チャレンジをえらんでね。");
    const selectedIds = [];
    for (const id of rawIds) {
      if (!isChallengeId(id) || !BY_ID[id]) {
        throw Error("チャレンジをえらんでね。");
      }
      selectedIds.push(id);
    }
    if (c.mode !== "practice" && c.mode !== "time") {
      throw Error("モードが不正です");
    }
    const long = selectedIds.some((id) => specOf(id).timeClass === "long");
    const quantity =
      c.mode === "practice"
        ? c.quantity === null
          ? null
          : (c.quantity ?? 10)
        : null;
    if (quantity !== null && ![10, 20, 30].includes(quantity)) {
      throw Error("問題数が不正です");
    }
    const timeLimitMs =
      c.mode === "time" ? (c.timeLimitMs ?? (long ? 120000 : 60000)) : null;
    if (
      c.mode === "time" &&
      !(long ? [60000, 120000, 180000] : [30000, 60000, 90000]).includes(
        timeLimitMs,
      )
    ) {
      throw Error("時間が不正です");
    }
    const optionsById = {};
    for (const id of selectedIds) {
      const o = c.optionsById?.[id] || {};
      const next = {};
      if (id === "G2-C08") {
        if (
          o.table !== undefined &&
          o.table !== null &&
          (!Number.isInteger(o.table) || o.table < 1 || o.table > 9)
        ) {
          throw Error("段が不正です");
        }
        next.table = o.table ?? null;
      }
      if (REMAINDER_IDS.includes(id)) {
        if (o.remainder !== undefined && !isRemainderMode(o.remainder)) {
          throw Error("余り条件が不正です");
        }
        next.remainder = o.remainder || "mixed";
      }
      if (o.written !== undefined) {
        if (
          !KZWritten.ids.includes(id) ||
          !isWrittenMode(o.written) ||
          (o.written !== "mixed" &&
            !KZWritten.available(id, next.remainder).includes(o.written))
        ) {
          throw Error("筆算の条件をたしかめてね。");
        }
        next.written = o.written;
      }
      optionsById[id] = next;
    }
    const minGrade = Math.min(...selectedIds.map((id) => specOf(id).grade));
    if (!isGrade(minGrade)) throw Error("学年をたしかめてね。");
    return {
      selectedIds,
      optionsById,
      mode: c.mode,
      quantity,
      timeLimitMs,
      languageGrade: minGrade,
      appVersion: VERSION,
    };
  }

  function schedule(
    ids,
    count,
    r,
  ) {
    const result = [];
    while (result.length < count) result.push(...shuffle(ids, r));
    return result.slice(0, count);
  }

  const scoreCorrect = (
    base,
    streak,
    hint,
  ) =>
    Math.round(
      base *
        (streak >= 8 ? 3 : streak >= 5 ? 2 : streak >= 3 ? 1.5 : 1) *
        (hint ? 0.5 : 1),
    );

  function present(s) {
    if (s.config.quantity !== null && s.records.length >= s.config.quantity) {
      return finish(s, "completed");
    }
    if (
      s.config.mode === "time" &&
      s.activeTimeRemainingMs !== null &&
      s.activeTimeRemainingMs <= 0
    ) {
      return finish(s, "natural-timeout");
    }
    const i = s.records.length;
    if (!s.schedule[i]) {
      const r = rng(s.generator.rngState);
      s.schedule.push(...shuffle(s.config.selectedIds, r));
      s.generator.rngState = r.state;
    }
    const id = s.schedule[i];
    const q = generate(id, s.config.optionsById[id], s.generator);
    q.questionId = `${s.runId}:${i}`;
    s.currentQuestion = q;
    s.records.push({
      questionId: q.questionId,
      challengeId: id,
      presentationIndex: i,
      question: q,
      wrongAttempts: 0,
      firstWrongAnswer: null,
      hintShown: false,
      helpUsed: false,
      terminal: null,
      endReason: null,
      earnedPoints: 0,
      streakAfter: null,
    });
    s.phase = "QUESTION";
    s.pauseReasons = s.pauseReasons.filter((p) => p === "hidden");
    return s;
  }

  function createRun(
    config,
    seed = Date.now(),
    now = 0,
  ) {
    const normalized = normalizeConfig(config);
    const r = rng(seed);
    const s = {
      runId: `${seed >>> 0}-${Math.floor(now)}`,
      config: normalized,
      phase: "PREPARING",
      currentQuestion: null,
      records: [],
      schedule: normalized.quantity
        ? schedule(normalized.selectedIds, normalized.quantity, r)
        : [],
      generator: createGenerator(r.state),
      score: 0,
      streak: 0,
      bestStreak: 0,
      activeTimeRemainingMs: normalized.timeLimitMs,
      pauseReasons: [],
      lastNow: now,
      finishedOnce: false,
      endReason: null,
    };
    return present(s);
  }

  function finish(s, reason) {
    if (s.finishedOnce) return s;
    const rec = s.records.at(-1);
    if (rec && !rec.terminal) {
      rec.terminal = "unanswered";
      rec.endReason = reason === "natural-timeout" ? reason : "manual";
    }
    s.phase = "RESULT";
    s.finishedOnce = true;
    s.endReason = reason;
    s.pauseReasons = [];
    return s;
  }

  function reduceRun(
    state,
    event,
    now,
  ) {
    const s = clone(state);
    s.notice = null;
    if (s.finishedOnce) return s;
    if (
      s.config.mode === "time" &&
      s.phase === "QUESTION" &&
      !s.pauseReasons.length &&
      s.activeTimeRemainingMs !== null
    ) {
      s.activeTimeRemainingMs = Math.max(
        0,
        s.activeTimeRemainingMs - Math.max(0, now - s.lastNow),
      );
    }
    s.lastNow = now;
    if (
      s.config.mode === "time" &&
      s.activeTimeRemainingMs !== null &&
      s.activeTimeRemainingMs <= 0
    ) {
      return finish(s, "natural-timeout");
    }
    const addPause = p => {
      if (!s.pauseReasons.includes(p)) s.pauseReasons.push(p);
    };
    const removePause = p => {
      s.pauseReasons = s.pauseReasons.filter((x) => x !== p);
    };
    const rec = s.records.at(-1);
    if (!rec) return s;
    if (event.questionId && event.questionId !== rec.questionId) return s;
    if (event.type === "HIDDEN") {
      addPause("hidden");
      return s;
    }
    if (event.type === "VISIBLE") {
      removePause("hidden");
      return s;
    }
    if (event.type === "END_CONFIRM") {
      addPause("confirm");
      return s;
    }
    if (event.type === "END_CANCEL") {
      removePause("confirm");
      return s;
    }
    if (event.type === "END_ACCEPT") return finish(s, "manual");
    if (event.type === "PAUSE" && s.phase === "QUESTION") {
      addPause("manual");
      return s;
    }
    if (event.type === "RESUME") {
      removePause("manual");
      return s;
    }
    if (event.type === "HINT_CONTINUE" && s.phase === "HINT_READING") {
      removePause("hint");
      s.phase = "QUESTION";
      return s;
    }
    if (event.type === "FEEDBACK_DONE" && s.pauseReasons.includes("confirm")) {
      return s;
    }
    if (event.type === "FEEDBACK_DONE" && s.phase === "WRONG_FEEDBACK") {
      removePause("wrong-animation");
      if (rec.wrongAttempts === 2 && !rec.hintShown) {
        rec.hintShown = true;
        s.phase = "HINT_READING";
        addPause("hint");
      } else {
        s.phase = "QUESTION";
      }
      return s;
    }
    if (
      (event.type === "FEEDBACK_DONE" && s.phase === "CORRECT_FEEDBACK") ||
      (event.type === "SOLUTION_NEXT" && s.phase === "SOLUTION_READING")
    ) {
      removePause("correct-animation");
      removePause("solution");
      return present(s);
    }
    if (s.phase !== "QUESTION" || s.pauseReasons.length || rec.terminal) {
      return s;
    }
    if (event.type === "HELP") {
      rec.helpUsed = true;
      rec.terminal = "help";
      rec.endReason = "help";
      rec.streakAfter = 0;
      s.streak = 0;
      s.phase = "SOLUTION_READING";
      addPause("solution");
      return s;
    }
    if (event.type !== "SUBMIT") return s;
    const parsed = normalizeInput(rec.question.answerSpec, event.raw);
    const result = judge(rec.question, parsed);
    if (result.inputError) {
      s.notice = result.inputError;
      return s;
    }
    if (result.correct) {
      s.streak++;
      s.bestStreak = Math.max(s.bestStreak, s.streak);
      rec.earnedPoints = scoreCorrect(
        specOf(rec.challengeId).basePoints,
        s.streak,
        rec.hintShown,
      );
      s.score += rec.earnedPoints;
      rec.terminal = "correct";
      rec.endReason = "correct";
      rec.normalizedCorrectAnswer = parsed;
      rec.streakAfter = s.streak;
      s.phase = "CORRECT_FEEDBACK";
      addPause("correct-animation");
      s.notice = `できた！${rec.wrongAttempts ? " やりなおして せいかい！" : ""} ＋${rec.earnedPoints}点`;
    } else {
      rec.wrongAttempts++;
      rec.firstWrongAnswer ||= clone(event.raw);
      s.streak = 0;
      s.phase = "WRONG_FEEDBACK";
      addPause("wrong-animation");
      s.notice = result.reason || "おしい！ もういちど！";
    }
    return s;
  }

  function deriveMetrics(
    records,
    unshownSlots = [],
    endReason = "manual",
  ) {
    const m = {
      displayN: records.length + unshownSlots.length,
      presented: records.length,
      unshown: unshownSlots.length,
      learningN: records.length + unshownSlots.length,
      unansweredN: records.length + unshownSlots.length,
      correctProblems: 0,
      helpProblems: 0,
      mistakeEvents: 0,
      hintProblems: 0,
      firstCorrectProblems: 0,
      finalSelfCorrectProblems: 0,
      repeatedWrongProblems: 0,
      unansweredProblems: unshownSlots.length,
      learningUnansweredCount: unshownSlots.length,
      exclusions: [],
      answerAccuracy: null,
    };
    records.forEach((r) => {
      const correct = r.terminal === "correct";
      const help = r.terminal === "help";
      const unanswered = r.terminal === "unanswered" || !r.terminal;
      m.correctProblems += +correct;
      m.helpProblems += +help;
      m.mistakeEvents += r.wrongAttempts + +help;
      m.hintProblems += +r.hintShown;
      m.firstCorrectProblems += +(correct && !r.wrongAttempts && !r.helpUsed);
      m.finalSelfCorrectProblems += +(correct && !r.helpUsed);
      m.repeatedWrongProblems += +(r.wrongAttempts >= 2);
      m.unansweredProblems += +unanswered;
      m.learningUnansweredCount += +unanswered;
      if (
        unanswered &&
        r.endReason === "natural-timeout" &&
        endReason === "natural-timeout"
      ) {
        m.unansweredN--;
        m.learningUnansweredCount--;
        if (!r.wrongAttempts) m.learningN--;
        m.exclusions.push({
          questionId: r.questionId,
          reason: "natural-timeout",
          learning: !r.wrongAttempts,
        });
      }
    });
    m.answerAccuracy =
      m.correctProblems + m.mistakeEvents
        ? m.correctProblems / (m.correctProblems + m.mistakeEvents)
        : null;
    return m;
  }

  function runMetrics(
    s,
    id = null,
  ) {
    const records = id
      ? s.records.filter((r) => r.challengeId === id)
      : s.records;
    const slots = s.config.quantity ? s.schedule.slice(s.records.length) : [];
    return deriveMetrics(
      records,
      id ? slots.filter((x) => x === id) : slots,
      s.endReason,
    );
  }

  function eligibility(s, id) {
    const m = runMetrics(s, id);
    return (
      m.learningN > 0 &&
      (s.config.quantity !== null ||
        s.config.mode === "time" ||
        s.records.length >= 10) &&
      (s.config.selectedIds.length < 2 || m.presented >= 10)
    );
  }

  function evaluateFallback(s) {
    const candidates = [];
    const excluded = [];
    for (const id of s.config.selectedIds) {
      const m = runMetrics(s, id);
      if (!eligibility(s, id)) {
        excluded.push(id);
        continue;
      }
      const flags = [
        m.unansweredN > 0 && m.learningUnansweredCount * 5 >= m.unansweredN,
        m.helpProblems * 5 >= m.learningN,
        m.repeatedWrongProblems * 5 >= m.learningN,
        m.firstCorrectProblems * 10 < m.learningN * 7,
        m.finalSelfCorrectProblems * 10 < m.learningN * 7,
      ];
      if (!flags.some(Boolean)) continue;
      const severity = Math.max(
        1 - m.firstCorrectProblems / m.learningN,
        1 - m.finalSelfCorrectProblems / m.learningN,
        m.helpProblems / m.learningN,
        m.repeatedWrongProblems / m.learningN,
        m.unansweredN ? m.learningUnansweredCount / m.unansweredN : 0,
      );
      const reason =
        m.unshown && flags[0]
          ? "まだ取り組んでいない問題もあったね。まずこの練習から"
          : [
              "こたえていない問題を、少しずつ練習しよう。",
              "助けてもらったところを、いっしょに練習しよう。",
              "何度かやりなおしたところを練習しよう。",
              "はじめの考え方を、もういちど練習しよう。",
              "こたえまでの道すじを練習しよう。",
            ][flags.findIndex(Boolean)];
      candidates.push({
        sourceId: id,
        targetId: specOf(id).fallbackParent || id,
        severity,
        conditionCount: flags.filter(Boolean).length,
        learningN: m.learningN,
        reason,
      });
    }
    candidates.sort(
      (a, b) =>
        b.severity - a.severity ||
        b.conditionCount - a.conditionCount ||
        b.learningN - a.learningN ||
        a.sourceId.localeCompare(b.sourceId),
    );
    return {
      recommendation: candidates[0] || null,
      excluded,
      insufficient: excluded.length === s.config.selectedIds.length,
    };
  }

  function bestKey(
    config,
    supportClass,
  ) {
    const normalized = normalizeConfig(config);
    if (
      normalized.selectedIds.length !== 1 ||
      (normalized.mode === "practice" && normalized.quantity === null)
    ) {
      return null;
    }
    const bestOptions = clone(normalized.optionsById);
    // A legacy unrestricted record and an explicit "both" option describe the same learning condition.
    for (const options of Object.values(bestOptions)) {
      if (options.written === "mixed") delete options.written;
    }
    return JSON.stringify([
      VERSION,
      normalized.selectedIds[0],
      bestOptions,
      normalized.mode,
      normalized.quantity ?? normalized.timeLimitMs,
      supportClass,
    ]);
  }

  function emptySave() {
    return {
      format: "kazohe-backup",
      appVersion: VERSION,
      schemaVersion: 1,
      settings: {
        name: "",
        onboarded: false,
        sound: true,
        effects: true,
        config: normalizeConfig({
          selectedIds: ["G1-C01"],
          mode: "practice",
          quantity: 10,
        }),
      },
      bestRecords: {},
      recommendation: null,
      returnStack: [],
      practiceCheckpoint: null,
    };
  }

  function checkpoint(s) {
    if (s.config.mode !== "practice") return null;
    const c = clone(s);
    const current = c.records.at(-1);
    if (current && !current.terminal) {
      Object.assign(current, {
        wrongAttempts: 0,
        firstWrongAnswer: null,
        hintShown: false,
        helpUsed: false,
        earnedPoints: 0,
      });
      const completed = c.records.slice(0, -1);
      c.streak = completed.at(-1)?.streakAfter || 0;
      c.score = completed.reduce((n, r) => n + r.earnedPoints, 0);
      c.bestStreak = Math.max(0, ...completed.map((r) => r.streakAfter || 0));
    }
    c.pauseReasons = [];
    c.lastNow = 0;
    if (
      current?.terminal &&
      current.terminal !== "unanswered" &&
      !c.finishedOnce
    ) {
      present(c);
    } else if (!c.finishedOnce) {
      c.phase = "QUESTION";
    }
    return c;
  }

  function applyResult(saved, s) {
    const next = clone(saved);
    const metrics = runMetrics(s);
    const supportClass = s.records.some(
      (r) => r.hintShown || r.helpUsed,
    )
      ? "supported"
      : "independent";
    const key = bestKey(s.config, supportClass);
    let newBest = false;
    if (
      key &&
      (!next.bestRecords[key] || s.score > next.bestRecords[key].score)
    ) {
      next.bestRecords[key] = {
        score: s.score,
        bestStreak: s.bestStreak,
        metrics,
        config: s.config,
        supportClass,
        endReason: s.endReason || "manual",
      };
      newBest = true;
    }
    const evaluated = evaluateFallback(s);
    if (evaluated.recommendation) {
      next.recommendation = evaluated.recommendation;
    } else if (
      next.recommendation &&
      s.config.selectedIds.includes(next.recommendation.targetId) &&
      eligibility(s, next.recommendation.targetId)
    ) {
      next.recommendation = null;
    }
    if (s.config.mode === "practice") next.practiceCheckpoint = null;
    return { saved: next, newBest, metrics, ...evaluated };
  }

  function recommendConfig(
    saved,
    current,
  ) {
    if (!saved.recommendation) return { saved, config: current };
    const next = clone(saved);
    const id = saved.recommendation.targetId;
    if (
      current.selectedIds.length &&
      (current.selectedIds.length !== 1 || current.selectedIds[0] !== id)
    ) {
      next.returnStack.push(clone(current));
    }
    return {
      saved: next,
      config: normalizeConfig({
        selectedIds: [id],
        mode: "practice",
        quantity: 10,
      }),
    };
  }

  function clearScores(
    saved,
    id = null,
  ) {
    const s = clone(saved);
    s.bestRecords = Object.fromEntries(
      Object.entries(s.bestRecords).filter(
        ([, r]) => Boolean(id) && r.config.selectedIds[0] !== id,
      ),
    );
    return s;
  }

  function validateBackup(text) {
    if (
      typeof text !== "string" ||
      new TextEncoder().encode(text).length > 16 * 1024 * 1024
    ) {
      throw Error("JSONは16 MiBまでです。");
    }
    const obj = JSON.parse(text);
    let nodes = 0;
    function scan(v, depth = 0, field = "") {
      if (++nodes > 1000000 || depth > 80) {
        throw Error("データが大きすぎます。");
      }
      if (v && typeof v === "object") {
        for (const [key, val] of Object.entries(v)) {
          if (["__proto__", "prototype", "constructor"].includes(key)) {
            throw Error("不正なキーです。");
          }
          scan(val, depth + 1, key);
        }
      } else if (
        typeof v === "number" &&
        (!Number.isFinite(v) ||
          (v < 0 && !(field === "places" && [-1, -2, -3, -4].includes(v))) ||
          v > Number.MAX_SAFE_INTEGER)
      ) {
        throw Error("不正な数値です。");
      } else if (typeof v === "string" && v.length > 20000) {
        throw Error("文字列が長すぎます。");
      }
    }
    scan(obj);
    function fail() {
      throw Error("バックアップの形式が正しくありません。");
    }
    if (
      !isRecord(obj) ||
      obj.format !== "kazohe-backup" ||
      obj.appVersion !== VERSION ||
      obj.schemaVersion !== 1
    ) {
      throw Error("対応していないバージョンです。");
    }
    const only = (v, keys) => {
      if (!isRecord(v) || Object.keys(v).some((k) => !keys.includes(k))) {
        fail();
      }
    };
    only(obj, BACKUP_TOP_KEYS);
    const set = obj.settings;
    if (
      !isRecord(set) ||
      typeof set.name !== "string" ||
      [...set.name].length > 30 ||
      /[\u0000-\u001f\u007f]/.test(set.name) ||
      ["sound", "effects", "onboarded"].some((k) => typeof set[k] !== "boolean")
    ) {
      fail();
    }
    only(set, BACKUP_SETTINGS_KEYS);
    const conf = c => {
      if (!isRunConfigInput(c)) fail();
      const normalized = normalizeConfig(c);
      if (JSON.stringify(normalized) !== JSON.stringify(c)) fail();
      return normalized;
    };
    conf(set.config);
    if (!isRecord(obj.bestRecords) || Object.keys(obj.bestRecords).length > 50000) {
      fail();
    }
    for (const [key, r] of Object.entries(obj.bestRecords)) {
      if (!isRecord(r)) fail();
      const recordConfig = conf(r.config);
      if (
        !isSupportClass(r.supportClass) ||
        bestKey(recordConfig, r.supportClass) !== key ||
        typeof r.score !== "number" ||
        !Number.isSafeInteger(r.score) ||
        r.score < 0 ||
        !isRecord(r.metrics) ||
        typeof r.bestStreak !== "number" ||
        !Number.isSafeInteger(r.bestStreak) ||
        !isEndReason(r.endReason)
      ) {
        fail();
      }
      const m = r.metrics;
      const nums = {};
      for (const k of METRICS_COUNTER_KEYS) {
        const val = m[k];
        if (typeof val !== "number" || !Number.isSafeInteger(val) || val < 0) {
          fail();
        }
        nums[k] = val;
      }
      if (
        nums.displayN !== nums.presented + nums.unshown ||
        nums.displayN !==
          nums.correctProblems + nums.helpProblems + nums.unansweredProblems ||
        nums.learningN > nums.displayN ||
        nums.unansweredN > nums.displayN ||
        nums.firstCorrectProblems > nums.finalSelfCorrectProblems ||
        nums.finalSelfCorrectProblems > nums.correctProblems ||
        nums.correctProblems > nums.learningN ||
        nums.helpProblems > nums.learningN ||
        nums.hintProblems > nums.presented ||
        nums.repeatedWrongProblems > nums.presented ||
        nums.learningUnansweredCount > nums.unansweredN
      ) {
        fail();
      }
      const accuracy =
        nums.correctProblems + nums.mistakeEvents
          ? nums.correctProblems / (nums.correctProblems + nums.mistakeEvents)
          : null;
      if (m.answerAccuracy !== accuracy) fail();
    }
    if (!Array.isArray(obj.returnStack) || obj.returnStack.length > 101) fail();
    obj.returnStack.forEach(conf);
    if (obj.recommendation) {
      const r = obj.recommendation;
      if (
        !isRecord(r) ||
        !isChallengeId(r.sourceId) ||
        !BY_ID[r.sourceId] ||
        r.targetId !== (specOf(r.sourceId).fallbackParent || r.sourceId) ||
        typeof r.reason !== "string"
      ) {
        fail();
      }
    }
    const s = obj.practiceCheckpoint;
    if (s) {
      if (!isRecord(s)) fail();
      const sConfig = conf(s.config);
      if (
        sConfig.mode !== "practice" ||
        !Array.isArray(s.records) ||
        !s.records.length ||
        s.records.length > 100000 ||
        !Array.isArray(s.schedule) ||
        s.schedule.some(
          (id) => !isChallengeId(id) || !sConfig.selectedIds.includes(id),
        ) ||
        (sConfig.quantity !== null &&
          (s.schedule.length !== sConfig.quantity ||
            s.records.length > sConfig.quantity))
      ) {
        fail();
      }
      if (
        !isRecord(s.generator) ||
        typeof s.generator.rngState !== "number" ||
        !Number.isInteger(s.generator.rngState) ||
        s.generator.rngState < 1 ||
        s.generator.rngState > 4294967295 ||
        !isRecord(s.generator.ids)
      ) {
        fail();
      }
      for (const [key, g] of Object.entries(s.generator.ids)) {
        const parsedKey = JSON.parse(key);
        if (!Array.isArray(parsedKey) || parsedKey.length < 2) fail();
        const [id, options] = parsedKey;
        if (
          !isChallengeId(id) ||
          !sConfig.selectedIds.includes(id) ||
          !isChallengeOptions(options) ||
          JSON.stringify(options) !== JSON.stringify(sConfig.optionsById[id])
        ) {
          fail();
        }
        const ds = domains(id, options);
        if (!isRecord(g) || !Array.isArray(g.round)) fail();
        const gRound = g.round;
        if (
          gRound.length > ds.reduce((n, d) => n + (d.weight || 1), 0) ||
          gRound.some(
            (i) =>
              typeof i !== "number" ||
              !Number.isInteger(i) ||
              i < 0 ||
              i >= ds.length,
          ) ||
          ds.some(
            (d, i) => gRound.filter((x) => x === i).length > (d.weight || 1),
          ) ||
          !isRecord(g.buckets) ||
          (g.last !== null && typeof g.last !== "string")
        ) {
          fail();
        }
        for (const [index, b] of Object.entries(g.buckets)) {
          if (
            !/^\d+$/.test(index) ||
            !ds[Number(index)] ||
            !isRecord(b) ||
            typeof b.cycle !== "number" ||
            !Number.isSafeInteger(b.cycle) ||
            b.cycle < 0 ||
            typeof b.cursor !== "string" ||
            !/^\d{1,80}$/.test(b.cursor) ||
            BigInt(b.cursor) >= ds[Number(index)].size ||
            !Array.isArray(b.used) ||
            b.used.length > 100000 ||
            new Set(b.used).size !== b.used.length ||
            b.used.some((k) => typeof k !== "string")
          ) {
            fail();
          }
        }
      }
      let score = 0;
      let streak = 0;
      let best = 0;
      const runId = typeof s.runId === "string" ? s.runId : "";
      const sRecords = s.records;
      const sSchedule = s.schedule;
      sRecords.forEach((r, i) => {
        if (
          !isRecord(r) ||
          !isChallengeId(r.challengeId) ||
          r.challengeId !== sSchedule[i] ||
          r.questionId !== `${runId}:${i}` ||
          !isQuestionShape(r.question) ||
          r.question.challengeId !== r.challengeId ||
          r.question.questionId !== r.questionId ||
          typeof r.wrongAttempts !== "number" ||
          !Number.isInteger(r.wrongAttempts) ||
          r.wrongAttempts < 0 ||
          typeof r.hintShown !== "boolean" ||
          typeof r.helpUsed !== "boolean" ||
          !["correct", "help", null].includes(r.terminal) ||
          (i < sRecords.length - 1 && !r.terminal)
        ) {
          fail();
        }
        const rebuilt = complete(
          { ...r.question, solutionTrace: undefined },
          r.question.conditionBucket,
        );
        const writtenMode = sConfig.optionsById[r.challengeId]?.written;
        if (
          writtenMode &&
          writtenMode !== "mixed" &&
          KZWritten.classify(rebuilt).has !== (writtenMode === "some")
        ) {
          fail();
        }
        if (
          JSON.stringify(rebuilt.expectedExactValue) !==
            JSON.stringify(r.question.expectedExactValue) ||
          rebuilt.canonicalKey !== r.question.canonicalKey ||
          !validateQuestion(specOf(r.challengeId), rebuilt).valid
        ) {
          fail();
        }
        if (r.wrongAttempts > 0) {
          if (!isRawAnswerInput(r.firstWrongAnswer)) fail();
          const p = normalizeInput(r.question.answerSpec, r.firstWrongAnswer);
          if (p.error || judge(r.question, p).correct) fail();
        } else if (r.firstWrongAnswer !== null) {
          fail();
        }
        if (r.hintShown !== (r.wrongAttempts >= 2)) fail();
        if (r.terminal === "help") {
          if (!r.helpUsed || r.earnedPoints !== 0) fail();
          streak = 0;
        } else if (r.terminal === "correct") {
          if (r.wrongAttempts) streak = 0;
          streak++;
          if (
            r.helpUsed ||
            typeof r.earnedPoints !== "number" ||
            r.earnedPoints !==
              scoreCorrect(specOf(r.challengeId).basePoints, streak, r.hintShown)
          ) {
            fail();
          }
          score += r.earnedPoints;
          best = Math.max(best, streak);
        } else if (
          r.wrongAttempts ||
          r.helpUsed ||
          r.hintShown ||
          r.earnedPoints
        ) {
          fail();
        }
      });
      const lastRec = sRecords.at(-1);
      if (
        score !== s.score ||
        streak !== s.streak ||
        best !== s.bestStreak ||
        s.phase !== (s.finishedOnce ? "RESULT" : "QUESTION") ||
        !Array.isArray(s.pauseReasons) ||
        s.pauseReasons.length ||
        !isRecord(lastRec) ||
        JSON.stringify(s.currentQuestion) !== JSON.stringify(lastRec.question)
      ) {
        fail();
      }
    }
    if (!isValidatedSaveData(obj)) fail();
    return clone(obj);
  }

  function storageAdapter(
    storage,
    notify = () => {},
  ) {
    let available = true;
    const failed = () => {
      available = false;
      notify(
        "このブラウザでは記録を保存できません。JSONに書き出して残せます。",
      );
    };
    try {
      storage.setItem(STORAGE_KEY + ":probe", "1");
      if (storage.getItem(STORAGE_KEY + ":probe") !== "1") throw Error("probe");
      storage.removeItem(STORAGE_KEY + ":probe");
    } catch {
      failed();
    }
    return {
      get available() {
        return available;
      },
      load() {
        try {
          const text = storage.getItem(STORAGE_KEY);
          return text ? validateBackup(text) : emptySave();
        } catch {
          failed();
          return emptySave();
        }
      },
      write(saved) {
        try {
          const text = JSON.stringify(saved);
          validateBackup(text);
          storage.setItem(STORAGE_KEY, text);
          return true;
        } catch {
          failed();
          return false;
        }
      },
      reset() {
        try {
          storage.removeItem(STORAGE_KEY);
          return true;
        } catch {
          failed();
          return false;
        }
      },
    };
  }

  const KZ = Object.freeze({
    VERSION,
    APP_VERSION,
    STORAGE_KEY,
    CATALOG,
    BY_ID,
    REMAINDER_IDS,
    clone,
    gcd,
    lcm,
    rat,
    number,
    calc,
    cmp,
    decimal,
    decimalPlaces,
    format,
    roundExact,
    lit,
    op,
    evaluate,
    expression,
    rng,
    shuffle,
    carry,
    borrow,
    domains,
    decode,
    atRank,
    complete,
    arithmetic,
    special,
    createGenerator,
    generate,
    buildHint,
    generalHint,
    buildSolution,
    answerText,
    normalizeInput,
    judge,
    validateQuestion,
    normalizeConfig,
    schedule,
    scoreCorrect,
    createRun,
    reduceRun,
    deriveMetrics,
    runMetrics,
    eligibility,
    evaluateFallback,
    bestKey,
    emptySave,
    checkpoint,
    applyResult,
    recommendConfig,
    clearScores,
    validateBackup,
    storageAdapter,
  });
return { KZLanguage, KZWritten, KZ, KZTeaching };
})();

    <script id="kazohe-app">
(() => {
"use strict";
  /* Display-only helpers. Embedded in the final HTML; no runtime dependencies. */


  const KZUI = (() => {
    const node = (
      tag,
      attrs = {},
      children = [],
    ) => {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        n.setAttribute(k, String(v));
      }
      const items = Array.isArray(children) ? children : [children];
      for (const c of items) {
        if (c !== null && c !== undefined) {
          n.append(typeof c === "string" ? document.createTextNode(c) : c);
        }
      }
      return n;
    };
    const readable = KZLanguage.readable;
    function math(
      value,
      grade = 6,
      attrs = {},
    ) {
      const s = readable(value, grade);
      const out = node("span", { class: "math-text", ...attrs });
      const pattern = /(?:(\d+)と)?(\d+|□)\/(\d+|□)/g;
      const appendText = text => {
        let end = 0;
        for (const m of text.matchAll(/(?<![\d.])\d{5,}(?![\d.])/g)) {
          const index = m.index ?? 0;
          out.append(text.slice(end, index));
          const groups = m[0].match(/\d{1,4}(?=(?:\d{4})*$)/g) ?? [];
          out.append(
            node(
              "span",
              { class: "large-number", "aria-label": m[0] },
              groups.map((part) =>
                node(
                  "span",
                  { class: "number-group", "aria-hidden": "true" },
                  part,
                ),
              ),
            ),
          );
          end = index + m[0].length;
        }
        out.append(text.slice(end));
      };
      let end = 0;
      for (const m of s.matchAll(pattern)) {
        const index = m.index ?? 0;
        appendText(s.slice(end, index));
        const f = node(
          "span",
          {
            class: "math-fraction",
            role: "math",
            "aria-label": `${m[3]}ぶんの${m[2]}`,
          },
          [
            node(
              "span",
              { class: "math-numerator", "aria-hidden": "true" },
              m[2],
            ),
            node(
              "span",
              { class: "math-denominator", "aria-hidden": "true" },
              m[3],
            ),
          ],
        );
        out.append(
          m[1]
            ? node(
                "span",
                {
                  class: "math-mixed",
                  role: "math",

        },
        Array.from({ length: d }, (_, i) =>
          el("span", { class: i < n ? "filled" : "" }),

      ),
    );

  function solution(q, stepIndex) {

  function solutionNavigation(
    step,
    count,
    move,
    prefix = "solution",
  ) {
    return el(
      "div",
      {
        class: "solution-navigation",
        role: "group",
        "aria-label": "ときかたを いってずつ",
      },
      [
        button("← もどる", () => move(-1), {
          "data-testid": prefix + "-back",
          disabled: step === 0,
        }),
        text("span", `${step + 1}／${count}`, {
          "data-testid": prefix + "-progress",
          "aria-live": "polite",
        }),
        button("つぎへ →", () => move(1), {
          "data-testid": prefix + "-forward",
          class: "primary",
          disabled: step === count - 1,
        }),
      ],
    );
  }

  function reviewSolution(q) {
    const viewer = el("div", { class: "review-solution" });
    const teaching = KZTeaching.steps(q);
    const qid = q.questionId ?? "";
    let step = appState.reviewSteps.get(qid) ?? 0;
    const move = (delta = 0) => {
      const active = document.activeElement;
      const focused =
        active && viewer.contains(active)
          ? active.getAttribute("data-testid")
          : null;
      step = Math.max(0, Math.min(step + delta, teaching.length - 1));
      appState.reviewSteps.set(qid, step);
      viewer.replaceChildren(
        solution(q, step),
        solutionNavigation(step, teaching.length, move, "review-solution"),
      );
      if (focused) {
        const target = viewer.querySelector(`[data-testid="${focused}"]`);
        const nextFocus =
          target && isControlDisabled(target)
            ? target
                .closest(".solution-navigation")
                ?.querySelector("button:not(:disabled)")
            : target;
        if (nextFocus instanceof HTMLElement) {
          nextFocus.focus({ preventScroll: true });
        }
      }
      if (delta) {
        appState.reviewQuestionId = qid;
        announce(`${step + 1}／${teaching.length}。${teaching[step].text}`);
      }
    };
    move();
    return viewer;
  }

  function fractionFieldValue(
    part,
    field,
  ) {
    if (!part) return "";
    if (field === "whole") return part.whole ?? "";
    if (field === "numerator") return part.numerator ?? "";
    if (field === "denominator") return part.denominator ?? "";
    return "";
  }

  function draftFieldValue(draft, key) {
    if (!draft) return "";
    if (key.includes("-first")) {
      return fractionFieldValue(draft.first, key.replace("-first", ""));
    }
    if (key.includes("-second")) {
      return fractionFieldValue(draft.second, key.replace("-second", ""));
    }
    if (key.startsWith("block-")) {
      return draft.values?.[Number(key.slice(6))] ?? "";
    }
    if (key === "value") return draft.value ?? "";
    if (key === "quotient") return draft.quotient ?? "";
    if (key === "remainder") return draft.remainder ?? "";
    if (key === "whole") return draft.whole ?? "";
    if (key === "numerator") return draft.numerator ?? "";
    if (key === "denominator") return draft.denominator ?? "";
    if (key === "set-value") return draft["set-value"] ?? "";
    return "";
  }

  function answerFields(
    q,
    disabled,
  ) {
    const s = q.answerSpec;
    const box = el("div", { class: "answer-fields", "data-testid": "answer" });
    let raw = () => ({});
    const activate = n => {
      appState.activeInput = n;
      box
        .querySelectorAll("input")
        .forEach((x) => x.classList.toggle("active-answer", x === n));
      const target = $("[data-active-target]");
      if (target) {
        target.textContent = KZUI.readable(
          (n.getAttribute("aria-label") ?? "") + "に いれるよ",
          uiGrade(),
        );
      }
      const point = $('[data-key="."]');
      if (point instanceof HTMLButtonElement) {
        point.disabled = disabled || n.inputMode !== "decimal";
      }
    };
    const input = (
      label,
      key,
      decimal = false,
    ) => {
      const value = draftFieldValue(appState.draft, key);
      const n = el("input", {
        type: "text",
        value,
        inputmode: decimal ? "decimal" : "numeric",
        autocomplete: "off",
        maxlength: "40",
        "aria-label": label,
        "data-testid": "answer-" + key,
        disabled,
        onFocus: () => {
          activate(n);
        },
      });
      return {
        n,
        node: el("label", { class: "field" }, [text("span", label), n]),
      };
    };
    const fraction = (
      suffix = "",
    ) => {
      const prefix =
        suffix === "-first"
          ? "1つめの "
          : suffix === "-second"
            ? "2つめの "
            : "";
      const whole = input(prefix + "整数の部分", "whole" + suffix);
      const num = input(prefix + "分子（上）", "numerator" + suffix);
      const den = input(prefix + "分母（下）", "denominator" + suffix);
      const form = el(
        "select",
        { "aria-label": "答えの形" + suffix, disabled },
        [
          ["fraction", "分数"],
          ["mixed", "帯分数"],
          ["integer", "整数"],
        ]
          .filter(([v]) =>
            s.type === "common" ||
            s.form ||
            challengeOf(q.challengeId).grade <= 3
              ? v === (s.form || "fraction")
              : true,
          )
          .map(([v, t]) => el("option", { value: v, text: t })),
      );
      const draftPart =
        suffix === "-first"
          ? appState.draft?.first
          : suffix === "-second"
            ? appState.draft?.second
            : appState.draft;
      form.value = draftPart?.form || s.form || "fraction";
      const f = el("div", { class: "fraction" }, [num.node, den.node]);
      const mixed = el("div", { class: "mixed" }, [whole.node, f]);
      const change = (event) => {
        whole.node.hidden = form.value === "fraction";
        f.hidden = form.value === "integer";
        if (event) {
          const next = form.value === "fraction" ? num.n : whole.n;
          activate(next);
          next.focus();
        }
      };
      form.addEventListener("change", change);
      change();
      return {
        node: el("div", {}, [
          el(
            "label",
            { class: "field form-choice", hidden: form.options.length === 1 },
            [text("span", "答えの形"), form],
          ),
          mixed,
        ]),
        read: () => ({
          form: form.value,
          whole: whole.n.value,
          numerator: num.n.value,
          denominator: den.n.value,
        }),
      };
    };
    if (s.type === "integer" || s.type === "decimal") {
      const x = input("こたえ", "value", s.type === "decimal");
      x.n.className = "wide";
      box.append(x.node);
      raw = () => ({ value: x.n.value });
    } else if (s.type === "quotient") {
      const a = input("商（こたえ）", "quotient");
      const b = input("あまり", "remainder", Boolean(s.decimalRemainder));
      box.append(a.node, b.node);
      raw = () => ({ quotient: a.n.value, remainder: b.n.value });
    } else if (s.type === "fraction") {
      const f = fraction();
      box.append(f.node);
      raw = f.read;
    } else if (s.type === "common") {
      const a = fraction("-first");
      const b = fraction("-second");
      const values = q.values ?? [];
      [a, b].forEach((f, i) => {
        const label =
          q.labels?.[i] || (values[i] !== undefined ? KZ.format(values[i]) : "");
        box.append(
          el("div", { class: "common-answer" }, [
            math(label + " ↓", {
              class: "math-text common-original",
            }),
            f.node,
          ]),
        );
      });
      raw = () => ({ first: a.read(), second: b.read() });
    } else if (s.type === "blocks") {
      const labels = s.labels ?? [];
      const inputs = labels.map((label, i) => input(label, "block-" + i));
      const ordered = inputs
        .map((x, i) => ({
          x,
          place: Number(labels[i].match(/[\d.]+/)?.[0] || 1),
        }))
        .sort((a, b) => b.place - a.place);
      ordered.forEach(({ x }) => box.append(x.node));
      box.classList.add("blocks-answer");
      raw = () => ({ values: inputs.map((x) => x.n.value) });
    } else if (s.type === "compare" || s.type === "parity") {
      let value = appState.draft?.value ?? null;
      const choices =
        s.type === "compare"
          ? [
              [">", "＞ 大きい"],
              ["<", "＜ 小さい"],
              ["=", "＝ 同じ"],
            ]
          : [
              ["even", "偶数（ぐうすう）"],
              ["odd", "奇数（きすう）"],
            ];
      choices.forEach(([v, t]) =>
        box.append(
          button(
            t,
            () => {
              value = v;
              box
                .querySelectorAll("button")
                .forEach((b) =>
                  b.setAttribute(
                    "aria-pressed",
                    String(b.dataset.choice === v),
                  ),
                );
            },
            { "aria-pressed": v === value, disabled, "data-choice": v },
          ),
        ),
      );
      raw = () => (value !== null ? { value } : {});
    } else if (s.type === "set") {
      const x = input("追加する数", "set-value");
      const chips = el("div", { class: "chips" });
      const values = [...(appState.draft?.values ?? [])];
      const error = text("p", "", { class: "inline-error", role: "alert" });
      const renderChips = () =>
        chips.replaceChildren(
          ...values.map((v) =>
            button(
              v + " ×",
              () => {
                values.splice(values.indexOf(v), 1);
                renderChips();
              },
              { "aria-label": v + "を消す", disabled },
            ),
          ),
        );
      const add = () => {
        const parsed = KZ.normalizeInput({ type: "integer" }, x.n.value);
        if (parsed.error) {
          announce(parsed.error);
          error.textContent = KZUI.readable(parsed.error, uiGrade());
          return;
        }
        if (!parsed.value || typeof parsed.value === "string") return;
        const v = parsed.value.n;
        if (values.includes(v)) {
          announce("同じ数は1回だけだよ。");
          error.textContent = "おなじ かずは 1かいだけだよ。";
          return;
        }
        values.push(v);
        error.textContent = "";
        x.n.value = "";
        renderChips();
        x.n.focus();
      };
      renderChips();
      box.append(
        x.node,
        button("追加", add, { disabled, "data-testid": "add-number" }),
        chips,
        error,
      );
      x.n.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          e.stopPropagation();
          add();
        }
      });
      raw = () => ({ values, "set-value": x.n.value });
    }
    const first = [...box.querySelectorAll("input")].find(
      (n) => !n.closest("[hidden]"),
    );
    if (first) {
      first.setAttribute("autofocus", "");
      activate(first);
    }
    return { box, raw };
  }

  const percent = (n, d) =>
    d ? `${Math.round((n / d) * 1000) / 10}%（${n}/${d}）` : "—";

  function positionStartDock() {
    const dock = dockRoot.querySelector(".start-dock");
    if (!(dock instanceof HTMLElement)) return;
    const viewport = window.visualViewport;
    const width = viewport?.width || window.innerWidth;
    const height = viewport?.height || window.innerHeight;
    const left = viewport?.offsetLeft || 0;
    const top = viewport?.offsetTop || 0;
    dock.style.setProperty("--dock-width", `${width}px`);
    dock.style.setProperty("--dock-center", `${left + width / 2}px`);
    dock.style.setProperty(
      "--dock-inset",
      `${Math.max(8, window.innerHeight - top - height + 8)}px`,
    );
    dock.classList.toggle("dock-compact", width < 360 || height < 240);
    document.documentElement.style.setProperty(
      "--dock-height",
      `${dock.getBoundingClientRect().height}px`,
    );
  }
  /* Menu screen, selection controls, recommendation card, and configuration updates for #kazohe-app. */


  const GRADES = [1, 2, 3, 4, 5, 6];
  const CATEGORIES = ["計算", "数"];
  const SUPPORT_KINDS = [
    ["independent", "じぶんで"],
    ["supported", "ヒント・たすけあり"],
  ];

  function setConfig(next, renderScreen) {
    const ids = next.selectedIds;
    if (!ids.length) {
      appState.config = { ...next, selectedIds: [] };
      renderScreen();
      return;
    }
    next.optionsById = { ...next.optionsById };
    for (const id of ids) {
      if (
        !appState.config.selectedIds.includes(id) &&
        KZWritten.ids.includes(id) &&
        !Object.hasOwn(KZWritten.fixed, id)
      ) {
        next.optionsById[id] = {
          ...next.optionsById[id],
          written: next.optionsById[id]?.written || "mixed",
        };
      }
    }
    const long = ids.some((id) => challengeOf(id).timeClass === "long");
    if (
      next.mode === "time" &&
      !(long ? [60000, 120000, 180000] : [30000, 60000, 90000]).includes(
        next.timeLimitMs,
      )
    ) {
      next.timeLimitMs = long ? 120000 : 60000;
    }
    appState.config = KZ.normalizeConfig(next);
    persist();
    renderScreen();
  }

  function recommendation(renderScreen) {
    const r = appState.saved.recommendation;
    if (!r) return null;
    return panel(
      [
        text("h3", "つぎの おすすめ"),
        text("p", r.reason),
        text("strong", challengeOf(r.targetId).title),
        el("div", { class: "actions" }, [
          button(
            "このれんしゅうを えらぶ",
            () => {
              const next = KZ.recommendConfig(appState.saved, appState.config);
              appState.saved = next.saved;
              appState.config = next.config;
              syncSelection();
              appState.activeScreen = "menu";
              persist();
              renderScreen();
            },
            { "data-testid": "recommendation" },
          ),
          button(
            "おすすめを消す",
            () => {
              appState.saved.recommendation = null;
              persist();
              renderScreen();
              if (appState.activeScreen === "result") {
                const current = appState.reviewQuestionId
                  ? app.querySelector(
                      `[data-review-question="${CSS.escape(appState.reviewQuestionId)}"]`,
                    )
                  : null;
                const details = app.querySelector("[data-result-details]");
                const review =
                  details instanceof HTMLDetailsElement && details.open
                    ? current instanceof HTMLDetailsElement && current.open
                      ? current
                      : app.querySelector("[data-review-question][open]")
                    : null;
                const target =
                  review?.querySelector(
                    ".solution-navigation button:not(:disabled)",
                  ) || details?.querySelector("summary");
                if (target instanceof HTMLElement) {
                  target.focus({ preventScroll: true });
                }
              } else {
                focusFirst();
              }
            },
            { "data-testid": "dismiss-recommendation" },
          ),
        ]),
      ],
      "recommendation",
    );
  }

  function returnButton(
    renderScreen,
  ) {
    return appState.saved.returnStack.length
      ? button(
          "さっきのチャレンジにもどる",
          () => {
            const previous = appState.saved.returnStack.pop();
            if (!previous) return;
            appState.config = previous;
            syncSelection();
            appState.activeScreen = "menu";
            persist();
            renderScreen();
          },
          { "data-testid": "return" },
        )
      : null;

  function menu(callbacks) {
    const { render: renderScreen, start, resumeCheckpoint, openSettings } =
      callbacks;
    const updateConfig = next => setConfig(next, renderScreen);
    const selected = new Set(appState.config.selectedIds);
    const long = appState.config.selectedIds.some(
      (id) => challengeOf(id).timeClass === "long",
    );
    const conditionNodes = appState.config.selectedIds.flatMap(
      (id) => {
        const writtenControls = [];
        if (KZWritten.ids.includes(id)) {
          const pair = Object.hasOwn(KZWritten.pairs, id)
            ? KZWritten.pairs[id]
            : undefined;
          if (!pair || id === pair.find((value) => selected.has(value))) {
            const available = KZWritten.available(
              id,
              appState.config.optionsById[id]?.remainder,
            );
            const fixedMode = Object.hasOwn(KZWritten.fixed, id)
              ? KZWritten.fixed[id]
              : undefined;
            const selectedMode = pair
              ? pair.every((value) => selected.has(value))
                ? "mixed"
                : fixedMode || "mixed"
              : appState.config.optionsById[id]?.written || "mixed";
            writtenControls.push(
              select(
                (pair
                  ? id === "G2-C01" || id === "G2-C02"
                    ? "2けたのたし算"
                    : "2けたのひき算"
                  : challengeOf(id).title) +
                  "の " +
                  KZWritten.label(id),
                [
                  ["none", "なし"],
                  ["some", "あり"],
                  ["mixed", "どちらも"],
                ],
                selectedMode,
                (value) => {
                  const nextWritten =
                    value === "none" || value === "some" ? value : "mixed";
                  if (pair) {
                    const ids = appState.config.selectedIds.filter(
                      (selectedId) => !pair.includes(selectedId),
                    );
                    ids.push(
                      ...(nextWritten === "mixed"
                        ? pair
                        : pair.filter(
                            (valueId) => KZWritten.fixed[valueId] === nextWritten,
                          )),
                    );
                    updateConfig({ ...appState.config, selectedIds: ids });
                  } else {
                    updateConfig({
                      ...appState.config,
                      optionsById: {
                        ...appState.config.optionsById,
                        [id]: {
                          ...appState.config.optionsById[id],
                          written: nextWritten,
                        },
                      },
                    });
                  }
                },
                { "data-testid": `written-option-${pair ? pair[0] : id}` },
              ),
            );
            if (pair && selectedMode === "mixed") {
              writtenControls.push(
                text("p", "「あり」と「なし」の2つのチャレンジから出すよ。", {
                  class: "condition-note",
                }),
              );
            }
            if (!pair && available.length === 1) {
              const control = writtenControls[0]?.querySelector("select");
              if (control) {
                for (const option of control.options) {
                  option.disabled = option.value === "some";
                }
              }
              writtenControls.push(

                  "p",
                  "このあまりなしの条件では、途中のひき算でくり下がりは起こらないよ。「どちらも」でも、なしの問題になるよ。",
                  {
                    class: "condition-note",

        if (id === "G2-C08") {

              appState.config.optionsById[id]?.table || 0,

                updateConfig({
                  ...appState.config,
                  optionsById: {
                    ...appState.config.optionsById,
                    [id]: { table: Number(v) || null },
                  },
                }),
              { "data-testid": "table-option" },
            ),
          ];

        if (KZ.REMAINDER_IDS.includes(id)) {
          return [

            select(
              challengeOf(id).title + "の あまり",

                ["none", "あまりなし"],
                ["some", "あまりあり"],

              appState.config.optionsById[id]?.remainder || "mixed",

                  ...appState.config,
                  optionsById: {
                    ...appState.config.optionsById,
                    [id]: {
                      ...appState.config.optionsById[id],
                      remainder: nextRemainder,
                      ...(appState.config.optionsById[id]?.written === "some" &&
                      !KZWritten.available(id, nextRemainder).includes("some")
                        ? { written: "none" }
                        : {}),
                    },

    const mode = select(
      "あそびかた",

        : select(

    const best = appState.config.selectedIds.length
      ? SUPPORT_KINDS.map(([kind, label]) => {

          return text(

          );

    const nodes = [

          text("p", "きょうの れんしゅう", { class: "eyebrow" }),
          text("h2", "なにを といてみる？"),
          text("p", "ひとつずつ、「できた！」を ふやそう。", {
            class: "menu-intro",
          }),
