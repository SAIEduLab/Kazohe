/* Each digit is one column; a decimal point sits at its boundary, never in a column. */
.written-wrap {
  max-width: 100%;
  overflow-x: auto;
  padding: 12px 8px;
  margin: 10px 0 18px;
  border-radius: 14px;
  background: #f6f8f1;
  border: 1px solid #dce4d4;
  text-align: left;
}
.written-board {
  --cell: 1.7rem;
  --row: 2.3rem;
  width: max-content;
  max-width: 100%;
  margin: 0 auto;
  font-variant-numeric: tabular-nums;
}
.written-equation {
  display: grid;
  grid-template-columns: var(--prefix) calc(var(--cols) * var(--cell)) minmax(
      0,
      auto
    );
  align-items: center;
  font-size: 1.45rem;
}
.written-prefix {
  height: var(--row);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  position: relative;
  padding-right: 0.3em;
  line-height: 1;
}
.written-prefix:has(.division-hook) {
  padding-right: 25px;
}
.written-prefix .math-text {
  font-size: 0.88em;
  white-space: nowrap;
}
.division-hook {
  position: absolute;
  right: -1px;
  top: 0;
  width: 24px;
  height: var(--row);
  overflow: visible;
}

                  right,

                q.answerSpec.type === "fraction" ? format(value) : show(value),

                  `求めた数を元の場所へ戻す。次の式は${expression(working)}。`,
                  { intent: "expression-replacement" },

              }
            };

        kind: "answer",
        text: `こたえ：${answerText(q)}`,
        ...(q.diagram ? { diagram: q.diagram } : {}),

              ? `${expression(ast)}。帯分数や小数を、1個分の大きさと個数が分かる分数へ直そう。その数がどこから来たか、順に確かめよう。`
              : ["+", "-"].includes(ast.op)
                ? unitA.d === unitB.d
                  ? `${expression(ast)}。どちらも1/${unitA.d}が1個分。分母${unitA.d}をそのままにして、分子の個数を${ast.op === "+" ? "合わせる" : "引く"}とどうなるかな。`
                  : `${expression(ast)}。1個分の大きさが同じかな。分母が違うので共通の倍数を探し、そろえた後の分子の個数を計算しよう。`
                : `${expression(ast)}。それぞれの分数の1個分と個数を確かめよう。${ast.op === "/" ? "わる数に何をかけると1になるかな。その数を両方にかけると商は変わらないよ。" : "分子をかけると個数、分母をかけると分け方がどう変わるかな。"}`;
          }
        }
      }
      return `${focus} ${generalHint(q)}`;
    }

    function steps(q) {
      const ast = q.expressionAST;
      if (!q.written || !ast?.op) return explain(q);
      const av = evaluate(ast.args[0]);
      const bv = evaluate(ast.args[1]);
      const sa = places(av);
      const sb = places(bv);
      const result = [];
      const board = { op: ast.op, cols: 2, rows: [] };
      const push = (
        text,
        check,
        meta = {},
      ) =>
        result.push({
          text,
          kind: "text",
          board: clone(board),
          ...(check ? { check } : {}),
          ...meta,
        });
      const blank = () => Array(board.cols).fill("");
      const mark = (
        row,
        column,
        value,
        crossed = false,
      ) => {
        row.annotations ||= {};
        row.annotations[column] = { value: String(value), crossed };
      };
      if (["+", "-"].includes(ast.op)) {
        const scale = Math.max(sa, sb);
        const a = coefficient(av, scale);
        const b = coefficient(bv, scale);
        const size = Math.max(String(a).length, String(b).length, scale + 1);
        const aa = String(a).padStart(size, "0").split("").map(Number);
        const bb = String(b).padStart(size, "0").split("").map(Number);
        board.cols =
          size + (ast.op === "+" && String(a + b).length > size ? 1 : 0);
        const offset = board.cols - size;
        const top = { digits: decimal(a, scale) };
        const answerDigits = blank();
        const answer = { digits: answerDigits, line: true };
        if (scale) answer.points = [board.cols - scale - 1];
        board.rows = [
          top,
          {
            digits: decimal(b, scale),
            sign: ast.op === "+" ? "＋" : "−",
            underline: true,
          },
          answer,
        ];
        push(
          scale
            ? "小数点と同じ位をそろえる。"
            : "同じ位をそろえ、一の位から計算する。",
        );
        if (scale) {
          push(
            `${format(av, "decimal")}＝${decimal(a, scale)}、${format(bv, "decimal")}＝${decimal(b, scale)}。右に0を補っても大きさは同じ。小数点をそろえ、同じ大きさの位で計算する。`,
          );
        }
        let carry = 0;
        for (let i = size - 1; i >= 0; i--) {
          const col = offset + i;
          board.focus = col;
          if (ast.op === "-") {
            if (aa[i] < bb[i]) {
              push(
                `${placeName(size - i - 1, scale)}は今${aa[i]}。${aa[i]}から${bb[i]}は引けないので、左の位から借りられるか見よう。`,
                undefined,
                {
                  intent: "borrow-need",
                  column: col,
                  current: aa[i],
                  subtract: bb[i],
                },
              );
              let j = i - 1;
              while (j >= 0 && aa[j] === 0) {
                board.focus = offset + j;
                push(
                  `${placeName(size - j - 1, scale)}も0なので、ここからは借りられない。もう1つ左の位を見よう。`,
                  undefined,
                  { intent: "borrow-search", column: offset + j, current: 0 },
                );
                j--;
              }
              if (j < 0) throw Error("Teaching borrow underflow");
              board.focus = offset + j;
              push(
                `${placeName(size - j - 1, scale)}には${aa[j]}あるので、ここから1を渡せる。隣の位へ順に移そう。`,
                undefined,
                { intent: "borrow-donor", column: offset + j, current: aa[j] },
              );
              // Across zeros, move one place at a time; old states never become extra rows.
              for (let k = j; k < i; k++) {
                const from = placeName(size - k - 1, scale);
                const to = placeName(size - k - 2, scale);
                const oldFrom = aa[k];
                const oldTo = aa[k + 1];
                push(
                  `${from}の1は、${to}では10と同じ大きさ。この10を${to}へ移そう。`,
                  undefined,
                  { intent: "borrow-unit", from: offset + k, to: offset + k + 1 },
                );
                aa[k]--;
                aa[k + 1] += 10;
                mark(top, offset + k, aa[k], true);
                mark(top, offset + k + 1, aa[k + 1], true);
                board.focus = offset + k + 1;
                push(
                  `${from}は${oldFrom}−1＝${aa[k]}。${to}は${oldTo}＋10＝${aa[k + 1]}。同時に交換するので、合わせた大きさは変わらない。`,
                  {
                    op: "+",
                    a: String(oldTo),
                    b: "10",
                    result: String(aa[k + 1]),
                  },
                  {
                    intent: "borrow-exchange",
                    from: offset + k,
                    to: offset + k + 1,
                    currentDigits: [...aa],
                  },
                );
              }
            }
            const value = aa[i] - bb[i];
            board.focus = col;
            answerDigits[col] = String(value);
            push(
              `${placeName(size - i - 1, scale)}：今の${aa[i]}から${bb[i]}を引くと${value}。${aa[i]}−${bb[i]}＝${value}。${value}を書く。${i ? `次は${placeName(size - i, scale)}。今は${aa[i - 1]}${aa[i - 1] < bb[i - 1] ? `なので${bb[i - 1]}を引けない。左の位を見よう。` : `から${bb[i - 1]}を引こう。`}` : "すべての位を計算できた。"}`,
              {
                op: "-",
                a: String(aa[i]),
                b: String(bb[i]),
                result: String(value),
              },
            );
          } else {
            const sum = aa[i] + bb[i] + carry;
            const previous = carry;
            push(
              `${placeName(size - i - 1, scale)}：${aa[i]}＋${bb[i]}${previous ? `＋${previous}（右の位から来たまとまり）` : ""}＝${sum}。`,
              {
                op: "+",
                a: String(aa[i] + bb[i]),
                b: String(previous),
                result: String(sum),
              },
              { intent: "column-sum", column: col },
            );
            if (sum >= 10) {
              push(
                `${sum}は10と${sum % 10}。この位の10個を、左の${placeName(size - i, scale)}の1個にまとめる。`,
                undefined,
                { intent: "carry-unit", column: col },
              );
            }
            answerDigits[col] = String(sum % 10);
            carry = Math.floor(sum / 10);
            if (carry) mark(top, col - 1, carry);
            push(
              `${placeName(size - i - 1, scale)}に${sum % 10}を書く。${carry ? `左の${placeName(size - i, scale)}へ1をくり上げる。次はその1も足す。` : i ? `次は${placeName(size - i, scale)}の${aa[i - 1]}と${bb[i - 1]}を足す。` : "すべての位を計算できた。"}`,
              {
                op: "+",
                a: String(aa[i] + bb[i]),
                b: String(previous),
                result: String(sum),
              },
            );
          }
        }
        if (carry) {
          answerDigits[0] = String(carry);
          push(`左の位に、くり上がった${carry}を書く。`);
        }
        if (ast.op === "-" && answerDigits[0] === "0") {
          push(
            "答えのいちばん左の0は省いて書ける。途中の位の0は、その場所を保つために残す。",
          );
        }
        answer.digits = decimal(ast.op === "+" ? a + b : a - b, scale);
      } else if (ast.op === "*") {
        const a = coefficient(av, sa);
        const b = coefficient(bv, sb);
        const product = a * b;
        const aa = String(a).split("").reverse().map(Number);
        const bb = String(b).split("").reverse().map(Number);
        board.cols = Math.max(
          String(a).length,
          String(b).length,
          String(product).length,
          sa + sb + 1,
        );
        const top = { digits: format(av, "decimal") };
        board.rows = [
          top,
          { digits: format(bv, "decimal"), sign: "×", underline: true },
        ];
        push(
          sa + sb
            ? "元の小数の式を確認する。整数の式に直して計算し、その倍率を最後に戻す。"
            : "一の位から、位ごとにかける。",
        );
        if (sa + sb) {
          push(
            `${format(av, "decimal")}を${10 ** sa}倍して${a}、${format(bv, "decimal")}を${10 ** sb}倍して${b}にする。作業する積は${10 ** sa}×${10 ** sb}＝${10 ** (sa + sb)}倍になる。`,
          );
          top.digits = String(a);
          board.rows[1].digits = String(b);
          board.caption = `整数に直した式：${a}×${b}。元の積の${10 ** (sa + sb)}倍を求めている。`;
          push(
            `ここからは作業用の整数の式${a}×${b}を筆算する。位の名前も、この整数の位を表す。最後に積を${10 ** (sa + sb)}で割って元に戻す。`,
            undefined,
            { intent: "integer-working-form" },
          );
        }
        const partials = [];
        const partialDigitArrays = [];
        for (let shift = 0; shift < bb.length; shift++) {
          top.annotations = {};
          const rowDigits = blank();
          const row = { digits: rowDigits, shift, line: shift === 0 };
          board.rows.push(row);
          partials.push(row);
          partialDigitArrays.push(rowDigits);
          if (shift) {
            push(
              `${placeName(shift)}の${bb[shift]}は${bb[shift] * 10 ** shift}。${a}×${bb[shift]}の${10 ** shift}倍なので、部分積は${placeName(shift)}から書く。`,
            );
          }
          let carry = 0;
          for (let i = 0; i < aa.length; i++) {
            const value = aa[i] * bb[shift] + carry;
            const previous = carry;
            const col = board.cols - 1 - i - shift;
            board.focus = col;
            push(
              `${aa[i]}×${bb[shift]}${previous ? `＋${previous}（右の位からのまとまり）` : ""}＝${value}。`,
              {
                op: "+",
                a: String(aa[i] * bb[shift]),
                b: String(previous),
                result: String(value),
              },
              { intent: "product-sum" },
            );
            if (value >= 10) {
              push(
                `${value}は${Math.floor(value / 10)}個の10と${value % 10}。10のまとまりを左の位へ渡す。`,
                undefined,
                { intent: "carry-unit" },
              );
            }
            rowDigits[col] = String(value % 10);
            carry = Math.floor(value / 10);
            if (carry && i + 1 < aa.length) mark(top, board.cols - 2 - i, carry);
            if (i + 1 === aa.length && carry) rowDigits[col - 1] = String(carry);
            if (i + 1 === aa.length) {
              // Keep one zero for a zero partial product, and omit other leading zeros.
              let first = rowDigits.findIndex((v) => v !== "" && v !== "0");
              if (first < 0) first = rowDigits.findLastIndex((v) => v !== "");
              for (let column = 0; column < first; column++) {
                rowDigits[column] = "";
              }
            }
            push(
              i + 1 === aa.length
                ? `この部分積の左端まで計算した。${value}を対応する位に書く。${carry ? "10のまとまりも、その左の位に書く。" : ""}`
                : `${value % 10}を書く。${carry ? `${carry}を左の位へくり上げ、次の積へ足す。` : "次の位をかける。"}`,
              {
                op: "+",
                a: String(aa[i] * bb[shift]),
                b: String(previous),
                result: String(value),
              },
            );
          }
        }
        top.annotations = {};
        let answer;
        if (partials.length === 1) {
          answer = partials[0];
        } else {
          const answerDigits = blank();
          answer = { digits: answerDigits, line: true };
          board.rows.push(answer);
          let carry = 0;
          for (let col = board.cols - 1; col >= 0; col--) {
            const add = partialDigitArrays.reduce(
              (sum, digits) => sum + Number(digits[col] || 0),
              0,
            );
            const previous = carry;
            const sum = add + carry;
            const terms = partialDigitArrays.map((digits) => digits[col] || "0");
            board.focus = col;
            push(
              `${placeName(board.cols - col - 1)}の部分積をたす：${terms.join("＋")}${previous ? `＋${previous}（くり上がり）` : ""}＝${sum}。`,
              {
                op: "+",
                a: String(add),
                b: String(previous),
                result: String(sum),
              },
              { intent: "partial-sum", terms, column: col },
            );
            if (sum >= 10) {
              push(
                `${sum}は10と${sum % 10}。10を左の位の1として渡す。`,
                undefined,
                { intent: "carry-unit" },
              );
            }
            answerDigits[col] = String(sum % 10);
            carry = Math.floor(sum / 10);
            if (carry && col > 0) mark(partials[0], col - 1, carry);
            push(
              `${placeName(board.cols - col - 1)}に${sum % 10}を書く。${carry ? "左の位へ1をくり上げ、次の列で足す。" : ""}`,
              {
                op: "+",
                a: String(add),
                b: String(previous),
                result: String(sum),
              },
            );
          }
        }
        answer.digits = String(product);
        if (sa + sb) {
          const originalProduct = decimal(product, sa + sb);
          push(
            `整数の式で求めた${product}は、元の積の${10 ** (sa + sb)}倍。${product}÷${10 ** (sa + sb)}＝${originalProduct}なので、小数点を${sa + sb}けた戻す。`,
          );
          for (const row of partials) {
            const effective = Array.isArray(row.digits)
              ? row.digits.map((digit) => digit || "0").join("")
              : row.digits;
            row.digits = decimal(BigInt(effective), sa + sb);
          }
          top.digits = format(av, "decimal");
          board.rows[1].digits = format(bv, "decimal");
          answer.digits = originalProduct;
          delete board.focus;
          board.caption =
            "元の小数の式に戻した筆算。部分積も元の大きさで表している。";
          push(
            `元の式に戻す：${format(av, "decimal")}×${format(bv, "decimal")}＝${originalProduct}。`,
          );
        }
      } else {
        const movedA = calc("*", av, rat(10n ** BigInt(sb)));
        const divisor = coefficient(bv, sb);
        const integerQuotient =
          q.answerSpec.type === "quotient" || Boolean(q.integerQuotient);
        const quotientPlaces = integerQuotient
          ? 0
          : q.roundPlaces !== undefined
            ? q.roundPlaces + 1
            : decimalPlaces(evaluate(ast));
        const parts = format(movedA, "decimal").split(".");
        const tail = (parts[1] || "")
          .padEnd(quotientPlaces, "0")
          .slice(0, quotientPlaces);
        const untouched = integerQuotient ? parts[1] || "" : "";
        const source = parts[0] + tail;
        const dividend =
          parts[0] + (tail || untouched ? "." + (tail || untouched) : "");
        board.cols = Math.max(2, source.length + untouched.length);
        const offset = board.cols - source.length - untouched.length;
        const quotientDigits = blank();
        const quotient = { digits: quotientDigits, quotient: true };
        if (tail) quotient.points = [offset + parts[0].length - 1];
        board.rows = [
          quotient,
          { digits: dividend, dividend, divisor: String(divisor) },
        ];
        if (sb) {
          board.caption = `両方を${10 ** sb}倍した筆算：${format(movedA, "decimal")}÷${divisor}。商の個数は元の式と同じ。`;
        }
        push(
          sb
            ? `${format(bv, "decimal")}を整数にするため、両方を${10 ** sb}倍する。同じ倍率なら何個分かは変わらない。${format(av, "decimal")}÷${format(bv, "decimal")}＝${format(movedA, "decimal")}÷${divisor}。`
            : "わる数と、わられる数を書き、左の位から計算する。",
        );
        if (tail.length > (parts[1] || "").length) {
          push(
            `${format(movedA, "decimal")}＝${dividend}。小数まで割り進めるために0を補える。数の大きさは変わらない。${q.roundPlaces !== undefined ? `小数第${q.roundPlaces}位まで丸めるには、もう1つ右の位まで求めておく。` : ""}`,
            undefined,
            { intent: "decimal-extension" },
          );
        }
        if (tail) {
          push(
            `商の小数点は、割られる数の小数点の真上。同じ位の答えを、その位へ書く。`,
          );
        }
        let remainder = 0n;
        let started = false;
        let previousRow = null;
        for (let i = 0; i < source.length; i++) {
          const partial = remainder * 10n + BigInt(source[i]);
          const digit = partial / divisor;
          const product = digit * divisor;
          const rem = partial - product;
          const trailing = source.length - i - 1 + untouched.length;
          if (started && previousRow) {
            push(
              `${placeName(source.length - i, tail.length)}の余り${remainder}を、次の${placeName(source.length - i - 1, tail.length)}の個数へ直すと${remainder}×10＝${remainder * 10n}。次の数字${source[i]}の分を合わせる。`,
              {
                op: "*",
                a: String(remainder),
                b: "10",
                result: String(remainder * 10n),
              },
              { intent: "lower-unit" },
            );
            previousRow.digits = String(partial);
            previousRow.trailing = trailing;
            push(
              `${remainder * 10n}＋${source[i]}＝${partial}。これが「次の数字を下ろす」という操作。`,
              {
                op: "+",
                a: String(remainder * 10n),
                b: source[i],
                result: String(partial),
              },
              { intent: "lower-combine" },
            );
          }
          board.focus = offset + i;
          if (digit || started || i >= parts[0].length - 1) {
            started = true;
            if (divisor >= 10n && partial >= divisor) {
              const power = 10n ** BigInt(String(divisor).length - 1);
              const leading = (divisor / power) * power;
              let trial = partial / leading;
              if (trial > 9n) trial = 9n;
              push(
                `${divisor}をおよそ${leading}として考える。${partial}÷${leading}から、商は${trial}くらいと見当を付ける。実際の積で確かめよう。`,
                undefined,
                { intent: "quotient-estimate" },
              );
              while (trial > digit) {
                quotientDigits[offset + i] = String(trial);
                push(
                  `${divisor}×${trial}＝${divisor * trial}は${partial}より大きい。試した${trial}では多い。1小さくして試そう。`,
                  {
                    op: "*",
                    a: String(divisor),
                    b: String(trial),
                    result: String(divisor * trial),
                  },
                );
                trial--;
                quotientDigits[offset + i] = String(trial);
                push(
                  `仮の商を${trial}に直した。次は${divisor}×${trial}を確かめる。`,
                  undefined,
                  { intent: "quotient-adjustment" },
                );
              }
            }
            push(
              `${divisor}×${digit}＝${product}は${partial}以下。${digit === 0n ? `${partial}では1組分の${divisor}を作れないので、この位の商は0。0を省くと位が変わってしまう。` : `${divisor}×${digit + 1n}＝${divisor * (digit + 1n)}は${partial}を超えるので、${digit}組まで。`}`,
              {
                op: "*",
                a: String(divisor),
                b: String(digit),
                result: String(product),
              },
              { intent: "quotient-choice" },
            );
            quotientDigits[offset + i] = String(digit);
            push(
              `${placeName(source.length - i - 1, tail.length)}の商として${digit}を書く。今見ている割られる数の位の真上に立てる。`,
            );
            board.rows.push({
              digits: String(product),
              trailing,
              sign: "−",
              underline: true,
              stage: "product",
            });
            push(`${divisor}×${digit}＝${product}。位をそろえて下に書く。`, {
              op: "*",
              a: String(divisor),
              b: String(digit),
              result: String(product),
            });
            previousRow = { digits: String(rem), trailing, stage: "remainder" };
            board.rows.push(previousRow);
            push(`${partial}−${product}＝${rem}。引いた答えを書く。`, {
              op: "-",
              a: String(partial),
              b: String(product),
              result: String(rem),
            });
            if (i + 1 === source.length) {
              push(
                `余り${rem}は割る数${divisor}より小さい。${integerQuotient ? "商は整数までなので、ここで止める。" : rem === 0n ? "余りが0になったので割り切れた。" : "求める位まで計算できた。"}`,
              );
            }
          } else {
            push(
              `${placeName(source.length - i - 1, tail.length)}の${partial}では、${divisor}を1組作れない。次の位まで合わせて見る。`,
              undefined,
              { intent: "division-start-search" },
            );
          }
          remainder = rem;
        }
        if (untouched && previousRow) {
          previousRow.digits = `${remainder}.${untouched}`;
          previousRow.trailing = 0;
          push(
            `商は整数まで。小数の部分を合わせ、あまりは${previousRow.digits}。`,
          );
        }
        if (q.roundPlaces !== undefined) {
          const last = quotientDigits[offset + parts[0].length + q.roundPlaces];
          const target =
            quotientDigits[offset + parts[0].length + q.roundPlaces - 1];
          push(
            `小数第${q.roundPlaces}位まで残す。1つ右の小数第${q.roundPlaces + 1}位は${last}。${Number(last) >= 5 ? `5以上なので、残す位の${target}を1増やす。9ならさらに左へくり上がる。` : "5未満なので、残す位はそのまま。"}`,
            undefined,
            { intent: "round-decision" },
          );
          const roundedText = format(
            roundExact(evaluate(ast), q.roundPlaces),
            "decimal",
          );
          quotient.digits = roundedText;
          quotient.trailing =
            quotientPlaces -
            (roundedText.split(".")[1] || "").length +
            untouched.length;
          delete quotient.points;
          // Rounding 9.99 to 10 adds a whole-number column. Keep every digit
          // visible and retain the place alignment of the earlier division rows.
          const extraColumns = Math.max(
            0,
            roundedText.replace(".", "").length + quotient.trailing - board.cols,
          );
          board.cols += extraColumns;
          board.focus = (board.focus ?? 0) + extraColumns;
          push(
            `小数第${q.roundPlaces + 1}位を見て四捨五入する。商は${roundedText}。`,
          );
        }
        if (sb && integerQuotient) {
          const wholeQuotient =

              q.answerSpec.type === "decimal" && decimalPlaces(value) < Infinity
                ? "decimal"
                : "fraction",
            );
        t.push(
          step(`${expression(node)} ＝ ${label}`, {
            value,
            check: { op: node.op, a, b, result: value },
          }),
        );
      };
      if (q.written) t.push(...writtenTrace(q));
      else if (!elementaryExplanation) walk(ast);
      if (q.roundPlaces !== undefined) {
        t.push(
          step(`小数第${q.roundPlaces + 1}位を見て、5以上なら切り上げる。`),
        );
      }
    } else if (q.task === "compare" && q.values) {
      const a = expectNumeric(q.values[0]);
      const b = expectNumeric(q.values[1]);
      if (["G1-N01", "G2-N01", "G3-N01", "G4-N01"].includes(q.challengeId)) {
        t.push(
          step(
            `けたの かずを みよう。同じなら、左の大きいくらいから くらべよう。${format(a)} と ${format(b)}。`,
          ),
        );
      } else if (["G3-N04", "G4-N04"].includes(q.challengeId)) {
        const places = Math.max(decimalPlaces(a), decimalPlaces(b));
        const padded = v => {
          const [i, f = ""] = format(v, "decimal").split(".");
          return i + (places ? "." + f.padEnd(places, "0") : "");
        };
        t.push(
          step(
            `小数点をそろえる：${padded(a)} と ${padded(b)}。左の大きい位からくらべる。`,
          ),
        );
      } else if (q.challengeId === "G3-N06" && q.labels) {
        t.push(
          step(`分母が同じなので、分子をくらべる。${q.labels.join(" と ")}。`),
        );
      } else {
        const ra = number(a);
        const rb = number(b);
        const d = lcm(ra.d, rb.d);
        t.push(
          step(
            `同じ1/${d}のまとまりで見ると、${(BigInt(ra.n) * d) / BigInt(ra.d)} と ${(BigInt(rb.n) * d) / BigInt(rb.d)}。`,
          ),
        );
      }
    } else if (
      (q.task === "divisors" || q.task === "gcd" || q.task === "lcm") &&
      q.values
    ) {
      const ds = n =>
        Array.from({ length: Number(n) }, (_, i) => i + 1).filter(
          (i) => Number(n) % i === 0,
        );
      q.values.forEach((rawN) => {
        const n = typeof rawN === "object" ? rawN.n : rawN;
        t.push(
          step(
            q.task === "lcm"
              ? `${n}の倍数：${Array.from({ length: Number(expectRational(q.expectedExactValue).n) / Number(n) }, (_, i) => Number(n) * (i + 1)).join("、")}`
              : `${n}の約数：${ds(n).join("、")}`,
          ),
        );
      });
    } else if (q.task === "common" && q.values && q.answerSpec.denominator) {
      const expArr = isRationalArray(q.expectedExactValue)
        ? q.expectedExactValue
        : [];
      const denom = BigInt(q.answerSpec.denominator);
      q.values.forEach((rawV, i) => {
        const v = expectRational(rawV);
        t.push(
          step(
            `${v.n}/${v.d} の分子・分母を${denom / BigInt(v.d)}倍 → ${expArr[i].n}/${expArr[i].d}`,
          ),
        );
      });
    } else if (q.task === "fraction" && q.original) {
      if (q.challengeId === "G5-N10") {
        const value = format(q.original, "decimal");
        const places = (value.split(".")[1] || "").length;
        t.push(
          step(
            places
              ? `小数${places}けたなので、分母を${10 ** places}、分子を${BigInt(value.replace(".", ""))}にする。最後に約分する。`
              : `${value}は1が${value}こ。分母1の分数で${value}/1。`,
          ),
        );
      } else if (q.answerSpec.form === "mixed") {
        const v = q.original;
        t.push(
          step(
            `${v.n}÷${v.d}＝${BigInt(v.n) / BigInt(v.d)} あまり${BigInt(v.n) % BigInt(v.d)}。整数の部分と、分母${v.d}の分数にする。`,
          ),
        );
      } else if (q.challengeId === "G4-N06") {
        const n = BigInt(q.original.n);
        const d = BigInt(q.original.d);
        t.push(
          step(
            `${n / d}×${d}＋${n % d}＝${n}。分母${d}はそのままで、分子を${n}にする。`,

        );
      } else {
        const g = gcd(q.original.n, q.original.d);
        t.push(
          step(
            g > 1n && q.answerSpec.reduced
              ? `分子${q.original.n}と分母${q.original.d}を${g}でわる。`
              : `同じ大きさの${q.original.d}つ分に分けたうちの${q.original.n}こ分。`,
          ),
        );
      }

      const v0 = typeof q.values[0] === "object" ? q.values[0].n : q.values[0];
      t.push(step(`${v0}÷2のあまりは${BigInt(v0) % 2n}。あまり0なら偶数。`));
    } else if (q.task === "reciprocal" && q.values) {
      t.push(
        step(
          `${format(expectNumeric(q.values[0]))} の分子と分母を入れかえる。かけて1になる。`,
        ),
      );
    } else if (q.task === "round" && q.values && q.places !== undefined) {
      const v0 = typeof q.values[0] === "object" ? q.values[0].n : q.values[0];
      t.push(
        step(
          `1つ下の位は${(BigInt(v0) / 10n ** BigInt(-q.places - 1)) % 10n}。5以上なら切り上げる。`,
        ),
      );
    } else if (q.task === "blocks" && q.values && q.answerSpec.labels) {
      const vals = q.values;
      t.push(
        step(
          q.answerSpec.labels
            .map((l, i) => `${l}は${String(vals[i])}こ`)
            .join("、"),
        ),
      );
    }
    t.push({ kind: "answer", text: `こたえ：${answerText(q)}` });
    return t;
  }

  function arithmetic(
    id,
    ast,
    spec = { type: "integer" },
    extra = {},
  ) {
    return {
      challengeId: id,
      task: "arithmetic",
      expressionAST: ast,
      answerSpec: spec,
      expectedExactValue: evaluate(ast),
      prompt: expression(ast),
      ...extra,
    };
  }

  function special(
    id,
    task,
    values,
    spec,
    extra = {},
  ) {
    return { challengeId: id, task, values, answerSpec: spec, ...extra };
  }

  function complete(q, bucket = "standard") {
    const id = q.challengeId;
    if (q.task === "arithmetic" && q.expressionAST) {
      q.expectedExactValue = evaluate(q.expressionAST);
    }
    q.conditionBucket = bucket;
    q.written = LONG_ARITHMETIC.test(id) && q.task === "arithmetic";
    if (q.task === "compare" && q.values) {
      const symbols = ["<", "=", ">"];
      const v0 = expectNumeric(q.values[0]);
      const v1 = expectNumeric(q.values[1]);
      q.expectedExactValue = symbols[cmp(v0, v1) + 1];
      q.prompt = `${q.labels?.[0] || format(v0)} □ ${q.labels?.[1] || format(v1)}`;
    }
    if (q.task === "parity" && q.values) {
      const v0 = typeof q.values[0] === "object" ? q.values[0].n : q.values[0];
      q.expectedExactValue = BigInt(v0) % 2n === 0n ? "even" : "odd";
      q.prompt = `${v0} は 偶数（ぐうすう）？ 奇数（きすう）？`;
    }
    if (q.task === "divisors" && q.values) {
      const n = Number(q.values[0]);
      q.expectedExactValue = Array.from({ length: n }, (_, i) => i + 1)
        .filter((i) => n % i === 0)
        .map(String);
      q.prompt = `${n} の正の約数を全部見つけよう`;
    }
    if ((q.task === "gcd" || q.task === "lcm") && q.values) {
      const v0 = typeof q.values[0] === "object" ? q.values[0].n : q.values[0];
      const v1 = typeof q.values[1] === "object" ? q.values[1].n : q.values[1];
      q.expectedExactValue = rat(
        q.task === "gcd" ? gcd(v0, v1) : lcm(v0, v1),
      );
      q.prompt = `${q.values.join(" と ")} の${q.task === "gcd" ? "最大公約数" : "最小公倍数"}`;
    }
    if (q.task === "round" && q.values && q.places !== undefined) {
      const v0 = expectNumeric(q.values[0]);
      q.expectedExactValue = roundExact(v0, q.places);
      const placeLabels = {
        1: "十",
        2: "百",
        3: "千",
        4: "万",
      };
      q.prompt = `${String(q.values[0])} を${placeLabels[-q.places]}の位まで四捨五入`;
    }
    if (q.task === "fraction" && q.values) {
      q.expectedExactValue = number(q.values[0]);
    }
    if (q.task === "reciprocal" && q.values && q.labels) {
      q.expectedExactValue = calc("/", 1, q.values[0]);
      q.prompt = `${q.labels[0]} の逆数を求めよう`;
    }
    if (q.task === "common" && q.values && q.labels) {
      const r0 = expectRational(q.values[0]);
      const r1 = expectRational(q.values[1]);
      const d = lcm(r0.d, r1.d);
      q.answerSpec.denominator = String(d);
      q.expectedExactValue = [r0, r1].map((v) => ({
        n: String((BigInt(v.n) * d) / BigInt(v.d)),
        d: String(d),
      }));
      q.prompt = `${q.labels.join(" と ")} を、最小公倍数を分母にして通分`;
    }
    if (
      q.task === "arithmetic" &&
      q.answerSpec.type === "quotient" &&
      q.expressionAST?.op
    ) {
      const a = evaluate(q.expressionAST.args[0]);
      const b = evaluate(q.expressionAST.args[1]);
      const v = calc("/", a, b);
      const quotient = BigInt(v.n) / BigInt(v.d);
      q.expectedExactValue = {
        quotient: String(quotient),
        remainder: calc("-", a, calc("*", b, rat(quotient))),
      };
      q.prompt = expression(q.expressionAST) + "（商は整数まで）";
    }
    if (
      q.task === "arithmetic" &&
      q.roundPlaces !== undefined &&
      q.expressionAST
    ) {
      q.expectedExactValue = roundExact(evaluate(q.expressionAST), q.roundPlaces);
      q.prompt =
        expression(q.expressionAST) +
        `（小数第${q.roundPlaces + 1}位を四捨五入して、小数第${q.roundPlaces}位まで）`;
    }
    q.canonicalKey = JSON.stringify([
      id,
      q.task,
      q.expressionAST || q.values,
      q.answerSpec,
      q.prompt,
    ]);
    q.solutionTrace = buildSolution(q);
    return q;
  }
  /* Finite rank domains, deterministic sampling, and all 101 challenge generators. */

  const D = (n, s) => decimal(n, s);

  const F = (n, d) =>
    lit(rat(n, d), `${n}/${d}`);

  const fractionSpec = (
    grade,
    policy = {},
  ) => ({
    type: "fraction",
    reduced: grade >= 5,
    ...policy,
  });

  // Each finite domain has a rank space. Collisions fall back to exhaustive rank
  // traversal; a cycle can advance only after that space has been exhausted.
  const domain = (
    dims,
    make,
    bucket = "standard",
  ) => ({
    dims,
    make,
    bucket,
    size: dims.reduce((a, [l, h]) => a * BigInt(h - l + 1), 1n),
  });

  function baseDomains(
    id,
    options = {},
  ) {
    const grade = specOf(id).grade;
    const I = { type: "integer" };
    const E = { type: "decimal" };
    const FS = fractionSpec(grade);
    const A = (
      sign,
      a,
      b,
      spec = I,
      extra = {},
    ) => arithmetic(id, op(sign, lit(a), lit(b)), spec, extra);
    const compare = (
      a,
      b,
      labels,
    ) =>
      special(
        id,
        "compare",
        [number(a), number(b)],
        { type: "compare" },
        { labels },
      );
    const blank = (
      x,
      prompt,
      solve,
    ) =>
      arithmetic(id, solve || lit(x), I, { prompt, unknown: String(x) });
    const frac = (
      n,
      d,
      prompt,
      policy = {},
    ) =>
      special(id, "fraction", [rat(n, d)], fractionSpec(grade, policy), {
        prompt,
        original: { n: String(n), d: String(d) },
      });
    const dec = (a, b, sign) =>
      A(sign, a, b, E);
    const sameFractions = (limit, addition) => [
      domain(
        [
          [2, limit],
          [0, 5 * limit],
          [0, 5 * limit],
        ],
        ([d, n, m]) => {
          const max = grade === 3 ? d : 5 * d;
          if (
            n > max ||
            m > max ||
            (addition && grade === 3 && (!n || !m || n + m > d)) ||
            (!addition && m > n)

            return null;
          }
          const f = num =>
            grade === 4 && num > d && num % d && num % 2
              ? lit(rat(num, d), `${Math.floor(num / d)}と${num % d}/${d}`)
              : F(num, d);

            displayDenominator: String(d),

        },
      ),
    ];
    const exprDomains = (
      kind,
    ) => {
      const signs = ["+", "-", "*", "/"];
      return signs.map((sign, idx) =>
        domain(
          [
            [0, kind === "decimal" ? 2000 : kind === "fraction" ? 60 : 100],
            [0, kind === "decimal" ? 2000 : kind === "fraction" ? 60 : 100],
            [0, kind === "decimal" ? 2000 : kind === "fraction" ? 60 : 100],
            [0, id === "G4-C15" ? 0 : 1],
            [2, kind === "fraction" ? 12 : 2],
            [2, kind === "fraction" ? 12 : 2],
            [2, kind === "fraction" ? 12 : 2],
          ],
          ([a, b, c, group, da, db, dc]) => {
            if (kind === "fraction" && (a > 5 * da || b > 5 * db || c > 5 * dc)) {
              return null;
            }
            const av = kind === "decimal" ? D(a, 2) : a;
            const bv = kind === "decimal" ? D(b, 2) : b;
            const cv = kind === "decimal" ? D(c, 2) : c;
            let x = kind === "fraction" ? F(a, da) : lit(av);
            const y = kind === "fraction" ? F(b, db) : lit(bv);
            const z = kind === "fraction" ? F(c, dc) : lit(cv);
            let ast;
            if (sign === "/") {
              x = op("*", x, y);
              ast = op("+", op("/", x, y, !!group), z);
            } else if (sign === "-") {
              ast = op("-", op("+", x, y, !!group), z);
            } else if (sign === "*") {
              ast = group
                ? op("*", op("-", x, y, true), z)
                : op("+", op("*", x, y), z);
            } else {
              ast = group
                ? op("*", op("+", x, y, true), z)
                : op("+", x, op("*", y, z));

              const value = evaluate(ast);
              if (kind === "decimal" && decimalPlaces(value) > 4) return null;
              const validIntermediates = node =>
                (!node.op || node.args.every(validIntermediates)) &&
                (kind !== "integer" || cmp(evaluate(node), 9999) <= 0) &&
                (kind !== "decimal" || decimalPlaces(evaluate(node)) <= 4);
              if (!validIntermediates(ast)) return null;
              return arithmetic(
                id,
                ast,
                kind === "fraction" ? FS : kind === "decimal" ? E : I,

              return null;
            }

          ["multiply-first", "subtract", "parentheses", "divide-first"][idx],
        ),
      );
    };

    if (id === "G2-N01") {
      return ["digit-length", "interior-zero", "equal"].map((bucket, k) =>
        domain(
          k === 2
            ? [[0, 9999]]
            : [
                [0, 9999],
                [0, 9999],
              ],
          ([a, bRaw]) => {
            const b = k === 2 ? a : bRaw;
            if (k !== 2 && a === b) return null;
            if (k === 0 && String(a).length === String(b).length) return null;
            if (
              k === 1 &&
              (String(a).length !== String(b).length ||
                ![a, b].some((n) => String(n).slice(1, -1).includes("0")))

              return null;

            return compare(a, b);

          bucket,
        ),
      );
    }
    if (
      id === "G1-N01" ||
      id === "G3-N01" ||
      id === "G4-N01" ||
      id === "G3-N04" ||
      id === "G4-N04"
    ) {
      const maxMap = {
        "G1-N01": 100,
        "G2-N01": 9999,
        "G3-N01": 99999999,
        "G3-N04": 99,
        "G4-N04": 99999,
      };
      const max = maxMap[id] || 99999999;
      return ["less", "equal", "greater"].map((bucket, k) =>
        domain(
          id === "G4-N01"
            ? k === 1
              ? [
                  [1, 99999999],
                  [0, 99999999],

              : [
                  [0, 99999999],
                  [0, 99999999],
                  [1, 99999999],
                  [0, 99999999],

            : k === 1

        domain(
          [
            [1, 9],
            [0, 9],

          ([a, b]) =>

                  id,
                  "blocks",
                  [String(a), String(b)],
                  { type: "blocks", labels: ["10のまとまり", "のこりの1"] },
                  {
                    prompt: `${10 * a + b} は10が□こ、1が□こ`,
                    expectedExactValue: [String(a), String(b)],

                  10 * a + b,
                  `10が${a}こ、1が${b}こ`,
                  op("+", op("*", lit(10), lit(a)), lit(b)),

        domain(
          [
            [0, 98],
            [0, 2],

              a + p,
              [a, a + 1, a + 2].map((n, i) => (i === p ? "□" : n)).join("、"),

        domain(

            [0, 9],

        domain(

            [0, 9],

    if (id === "G1-C03") {
      return [
        domain(
          [
            [1, 9],
            [1, 9],

          ([a, b]) => (a + b >= 11 ? A("+", a, b) : null),
          "carry",

    if (id === "G1-C04") {
      return [
        domain(
          [
            [0, 10],
            [0, 10],

          ([a, b]) => (a >= b ? A("-", a, b) : null),

      return [
        domain(
          [
            [11, 18],
            [1, 9],

        domain(
          kind

                [1, 9],
                [0, 9],

        domain(
          [
            [0, 9],
            [0, 9],
            [0, 9],
          ],
          ([a, b, c]) => {
            try {
              const ast = op(
                i & 1 ? "-" : "+",
                op(i & 2 ? "-" : "+", lit(a), lit(b)),
                lit(c),

                cmp(evaluate(ast), 20) > 0 ||
                cmp(evaluate(ast.args[0]), 20) > 0

                return null;
              }

            } catch {

          `signs-${i}`,
        ),

                  ? lit(n)
