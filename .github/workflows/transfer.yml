name: Temporary fixed-commit public migration

on:
  push:
    branches: [main]
    paths: [.github/workflows/transfer.yml]

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Copy verified bytes into a new local baseline and work branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_dir="$RUNNER_TEMP/kazohe-fixed-source"
          git init -q "$source_dir"
          git -C "$source_dir" fetch --no-tags --depth=1 https://github.com/SAIEduLab/Kazohe2.git 45a8e6cf9dd0dbca80d178dd1c41b30455058001
          test "$(git -C "$source_dir" rev-parse FETCH_HEAD)" = "45a8e6cf9dd0dbca80d178dd1c41b30455058001"
          test "$(git -C "$source_dir" rev-parse FETCH_HEAD:Kazohe.html)" = "a2ebd062b1d9cd507260d700bc6330377314a8c2"
          git -C "$source_dir" show FETCH_HEAD:LICENSE | cmp - LICENSE
          if git ls-remote --exit-code --heads origin migration/public-rebuild > /dev/null; then
            echo "Migration branch already exists; refusing to overwrite it" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git -C "$source_dir" show FETCH_HEAD:Kazohe.html > Kazohe.html
          test "$(git hash-object Kazohe.html)" = "a2ebd062b1d9cd507260d700bc6330377314a8c2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Kazohe.html
          git commit -m "Preserve fixed v0.2 HTML in new public baseline"
          git push origin HEAD:refs/heads/main
          git switch -c migration/public-rebuild
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            git -C "$source_dir" show "FETCH_HEAD:$path" > "$path"
          done <<'FILES'
          .gitattributes
          .gitignore
          CHANGELOG.md
          README.md
          docs/verification.md
          package.json
          package-lock.json
          playwright.config.mjs
          src/app.js
          src/catalog.json
          src/core.js
          src/shell.html
          src/style.css
          src/view.js
          scripts/aggregate-evidence.mjs
          scripts/audit-catalog.mjs
          scripts/audit-release.mjs
          scripts/audit-single-html.mjs
          scripts/build.mjs
          scripts/coverage.mjs
          scripts/independent-math-oracle.mjs
          scripts/lint.mjs
          scripts/load-inline-core.mjs
          scripts/manifest.mjs
          scripts/release-gate.mjs
          scripts/report.mjs
          scripts/review-gallery.mjs
          scripts/run-unit.mjs
          scripts/test-reporter.mjs
          scripts/visual-diff.mjs
          tests/e2e/app.spec.mjs
          tests/e2e/usability.spec.mjs
          tests/evidence/visual-review.json
          tests/fixtures/catalog.json
          tests/fixtures/implementation-map.json
          tests/fixtures/representatives.mjs
          tests/fixtures/tc-ids.json
          tests/property/domain-contracts.mjs
          tests/property/generators.mjs
          tests/unit/core.mjs
          tests/unit/pedagogy.mjs
          FILES
          git add --all
          git commit -m "Import selected v0.2 sources and audit assets"
          git push origin HEAD:refs/heads/migration/public-rebuild
